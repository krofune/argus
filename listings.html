<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280"><title>Argus Research · 매물·공고</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --top:#14243b; --top2:#1c3150; --rail:#ffffff;
  --bg:#eef1f5; --panel:#ffffff; --line:#dbe0e7; --line2:#e9edf2;
  --tx:#1d2733; --tx2:#5b6675; --tx3:#8b95a3;
  --ac:#2463a8; --ac-bg:#e8f0fa; --ac2:#1a4f8a;
  --b-done:#2e7d5b; --b-pref:#2a7f8f; --b-mkt:#a86a14; --b-bid:#8a5bb0; --b-wd:#b23b3b;
  --b-pf:#2463a8; --b-br:#4f6a8f; --b-ln:#5c6b7a;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 'IBM Plex Sans KR',system-ui,sans-serif;color:var(--tx);background:var(--bg);display:grid;grid-template-rows:40px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* scrollbar: thin, low-contrast */
*{scrollbar-width:thin;scrollbar-color:#cfd5dd transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d3d9e0;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#aeb7c3}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--top);color:#dfe7f1;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #0b1626}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff;letter-spacing:.2px}
.brand .logo{width:18px;height:18px}
.brand small{font-weight:400;color:#8fa3bd;margin-left:-3px}
.top .sep{width:1px;height:18px;background:#2c4263}
.top .crumb{color:#a9b9cd}
.top .crumb b{color:#fff;font-weight:500}
.top .sp{flex:1}
.gsearch{display:flex;align-items:center;gap:6px;background:var(--top2);border:1px solid #2c4263;height:26px;padding:0 8px;width:280px;color:#8fa3bd}
.gsearch input{background:none;border:0;outline:0;color:#fff;font:inherit;width:100%}
.top .meta{color:#8fa3bd;font-size:12px}

.main{display:grid;grid-template-columns:52px 1fr;min-height:0}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rail a{width:44px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);text-decoration:none;font-size:10px;border-left:2px solid transparent}
.rail a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail a.on{color:var(--ac);border-left-color:var(--ac);background:var(--ac-bg)}
.rail a:hover{color:var(--tx)}

.work{display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}
/* page header */
.ph{background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:flex-end;gap:22px;height:44px}
.ph h1{font-size:15px;font-weight:600;align-self:center;margin-right:6px}
.tabs{display:flex;gap:20px;align-self:stretch}
.tabs button{border-bottom:2px solid transparent;color:var(--tx2);padding:0 1px;display:flex;align-items:center}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}
.ph .sp{flex:1}
.ph .tools{align-self:center;display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:3px 9px;font-size:12px;color:var(--tx2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac-bg);color:var(--ac2);font-weight:500}
.btn{border:1px solid var(--line);padding:3px 10px;font-size:12px;background:#fff;display:flex;gap:5px;align-items:center}
.btn:hover{border-color:#b9c2ce}

/* timeline strip */
.strip{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.kpis{display:flex;gap:0}
.kpi{padding:0 18px 0 0;margin-right:18px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11px;color:var(--tx3);text-transform:none;letter-spacing:.2px}
.kpi .v{font:500 18px var(--mono);color:var(--tx)}
.kpi .v small{font-size:11px;color:var(--tx3);margin-left:3px;font-family:'IBM Plex Sans KR'}
.hist{height:48px;position:relative}
.hist svg{width:100%;height:100%;display:block}
.legend{display:flex;gap:12px;font-size:11px;color:var(--tx3);justify-content:flex-end;margin-bottom:2px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-0px}

/* body: facets + table */
.body{display:grid;grid-template-columns:232px 1fr;min-height:0;position:relative;transition:grid-template-columns .18s ease}
.body.nof{grid-template-columns:46px 1fr}
.body.nof .facets>*:not(.frow),.body.nof .fsearch{display:none}

.sbt{width:26px;height:24px;display:grid;place-items:center;border:1px solid var(--line);color:var(--tx2);flex:none}
.sbt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.sbt:hover{color:var(--tx);border-color:#b9c2ce}
.sbt.on{background:var(--ac-bg);color:var(--ac2);border-color:#c6d6ea}
.sbt.on svg .fill{fill:currentColor;stroke:none}
.facets{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 0 30px}
.frow{display:flex;gap:6px;align-items:center;margin:0 10px 8px}
.fsearch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);height:26px;padding:0 8px;color:var(--tx3);background:#fff}
.fsearch:focus-within{border-color:#9db6d4}
.fsearch input{border:0;outline:0;font:inherit;width:100%;color:var(--tx);background:#fff;-webkit-appearance:none;appearance:none}
.fsearch input::placeholder{color:var(--tx3)}
.fhead{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:11px;color:var(--tx3);background:#f6f8fa;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-top:6px;letter-spacing:.3px}
.fhead button{font-size:11px;color:var(--ac)}
.fg{padding:6px 12px 2px}
.fg h4{font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;cursor:pointer;user-select:none}
.fg h4 .car{width:14px;text-align:center;color:var(--tx3);font:400 14px/1 var(--mono)}
.fg h4:hover .car{color:var(--tx)}
.fg.closed ul{display:none}
.fg ul{list-style:none}
.fg li{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;color:var(--tx2)}
.fg li:hover{color:var(--tx)}
.fg li .cb{width:12px;height:12px;border:1px solid #aab4c1;display:grid;place-items:center;flex:none;background:#fff}
.fg li.on .cb{background:var(--ac);border-color:var(--ac)}
.fg li.on .cb:after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(0,-1px)}
.fg li .sw{width:3px;height:12px;flex:none}
.fg li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg li .ct{font:11px var(--mono);color:var(--tx3)}
.fg li.zero{opacity:.45}
.fg .more{font-size:11px;color:var(--ac);padding:2px 0 0 19px}

.tablewrap{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;background:var(--panel)}
.tbar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.tbar b{color:var(--tx);font-weight:600}
.tsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);height:26px;padding:0 8px;width:280px;background:#fff;color:var(--tx3)}
.tsearch:focus-within{border-color:#9db6d4}
.tsearch input{border:0;outline:0;font:inherit;width:100%;color:var(--tx);background:#fff;appearance:none}
.tsearch input::placeholder{color:var(--tx3)}
.psel{position:relative}
.psel>button{height:26px;border:1px solid var(--line);background:#fff;padding:0 8px 0 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx);white-space:nowrap}
.psel>button:hover,.psel.open>button{border-color:#9db6d4}
.psel>button svg{width:10px;height:10px;stroke:var(--tx2);fill:none;stroke-width:2;transition:transform .15s}
.psel.open>button svg{transform:rotate(180deg)}
.psel ul{display:none;position:absolute;right:0;top:calc(100% + 3px);min-width:100%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(20,36,59,.1);list-style:none;z-index:20;padding:3px 0}
.psel.open ul{display:block}
.psel li{padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.psel li:hover{background:#f3f6fa}
.psel li.on{color:var(--ac);font-weight:600;background:var(--ac-bg)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid #c6d6ea;background:var(--ac-bg);color:var(--ac2);padding:0 6px;font-size:11px;display:flex;gap:4px;align-items:center}
.chip button{color:var(--ac2);font-size:12px;line-height:1}
.tbar .sp{flex:1}
.scroll{overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
thead th{position:sticky;background:#f6f8fa;z-index:2;font-weight:500;color:var(--tx2);font-size:11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
thead tr.g th{top:0;height:22px;padding:0 10px;text-align:center;letter-spacing:.8px;color:var(--tx3);border-bottom:1px solid var(--line2);font-size:10px}
thead tr.g th+th{border-left:1px solid var(--line)}
thead tr.c th{top:22px;height:28px;padding:0 10px;cursor:pointer;user-select:none}
thead tr.c th.r{text-align:right}
thead tr.c th.gl{border-left:1px solid var(--line)}
thead th .ar{color:var(--ac);margin-left:3px}
tbody td{padding:0 10px;height:32px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody td.r{text-align:right}
tbody td.gl{border-left:1px solid var(--line2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f5f8fc}
tbody tr.sel td{background:var(--ac-bg)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ac)}
td.bar{padding:0 0 0 0;width:4px}
td.bar i{display:block;width:3px;height:20px}
td.dt{color:var(--tx2);font-size:12px}
td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
td.nm .sub{display:block;font-weight:400;font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
td.nm.two{height:40px;line-height:1.3}
td.party{max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:12px}
td.mut{color:var(--tx3)}
.badge{display:inline-block;font-size:11px;padding:0 6px;line-height:18px;border:1px solid;font-weight:500}
.dash{color:#c0c7d1}
.tfoot{border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:6px 14px;font-size:12px;color:var(--tx2)}
.tfoot .sp{flex:1}
.pg{display:flex;gap:2px}
.pg button{min-width:24px;height:22px;border:1px solid transparent;font:12px var(--mono);color:var(--tx2)}
.pg button.on{border-color:var(--line);background:#fff;color:var(--tx);font-weight:500}
.pg button:disabled{opacity:.35;cursor:default}
.pg .gap{min-width:18px;text-align:center;color:var(--tx3);font:12px var(--mono);line-height:22px}
.note{font-size:11px;color:var(--tx3)}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(640px,62%);background:var(--panel);border-left:1px solid #c3cbd6;box-shadow:-8px 0 24px rgba(20,36,59,.08);transform:translateX(102%);transition:transform .22s ease;display:grid;grid-template-rows:auto auto 1fr;z-index:10}
.drawer.open{transform:none}
.dh{padding:12px 16px 10px;border-bottom:1px solid var(--line2);border-top:3px solid var(--ac)}
.dh .r1{display:flex;align-items:flex-start;gap:10px}
.dh h2{font-size:16px;font-weight:600;flex:1;line-height:1.35}
.dh .x{font-size:18px;color:var(--tx3);line-height:1;padding:2px 4px}
.dh .x:hover{color:var(--tx)}
.dh .r2{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.dh .r2 .pill{border:1px solid var(--line);padding:0 6px;line-height:18px;font-size:11px;color:var(--tx2)}
.dh .r2 a{color:var(--ac);text-decoration:none;margin-left:auto}
.dh .r2 a:hover{text-decoration:underline}
.dtabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);height:34px}
.dtabs button{border-bottom:2px solid transparent;color:var(--tx2);font-size:12px}
.dtabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}
.dbody{overflow:auto;padding:14px 16px 30px}
.terms{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:16px}
.terms>div{padding:8px 10px;border-right:1px solid var(--line2)}
.terms>div:last-child{border-right:0}
.terms .l{font-size:10px;letter-spacing:.6px;color:var(--tx3)}
.terms .v{font:500 16px var(--mono);margin-top:1px}
.terms .v.na{color:#b4bcc7;font-size:13px;font-family:'IBM Plex Sans KR'}
.terms .s{font-size:10px;color:var(--tx3)}
.sec{margin-bottom:16px}
.sec h5{font-size:11px;letter-spacing:.6px;color:var(--tx3);font-weight:500;padding-bottom:4px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--tx3)}
.kv dd{color:var(--tx)}
.lst{list-style:none;font-size:12px}
.lst li{padding:3px 0 3px 12px;position:relative;color:var(--tx)}
.lst li:before{content:"";position:absolute;left:2px;top:10px;width:4px;height:1px;background:var(--tx3)}
.quote{font-size:12px;background:#f6f8fa;border-left:2px solid #b9c6d6;padding:8px 10px;color:var(--tx2)}
.quote .auto{font-size:10px;color:var(--tx3);display:block;margin-top:4px}
.tt{width:100%;border-collapse:collapse;font-size:12px;min-width:0}
.tt th{font-weight:500;color:var(--tx3);font-size:11px;text-align:left;border-bottom:1px solid var(--line);padding:4px 6px;background:#f6f8fa;position:static}
.tt td{border-bottom:1px solid var(--line2);padding:5px 6px;height:auto;white-space:normal}
.tt .r{text-align:right}
.calc{font-size:11px;color:var(--tx2);margin-top:8px;line-height:1.6}
.calc b{color:var(--tx3);font-weight:500;display:inline-block;width:42px}
.empty{color:var(--tx3);font-size:12px;padding:16px 0}
.rel li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.rel li:hover .n{color:var(--ac)}
.rel .d{color:var(--tx3);width:44px;flex:none}
.rel .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .a{font-family:var(--mono);color:var(--tx2)}
.fbtn{display:none}



.work{grid-template-rows:auto 1fr}
#view{min-height:0;overflow:auto;background:var(--bg)}
.note{font-size:11px;color:var(--tx3)}
.ct{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h5{font-size:11px;letter-spacing:.5px;color:var(--tx3);font-weight:500;padding-bottom:5px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.hot{color:#b23b3b!important;font-weight:600}
.chipsel{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chipsel button{border:1px solid var(--line);background:#fff;padding:2px 9px;font-size:12px;color:var(--tx2)}
.chipsel button.on{background:var(--ac-bg);border-color:#c6d6ea;color:var(--ac2);font-weight:500}
.chipsel .vs{width:1px;height:16px;background:var(--line);margin:0 4px}
.bar2{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar2 .sp{flex:1}
.rbar{height:4px;background:#eef1f5;position:relative;margin:8px 0 2px}.rbar i{display:block;height:100%}.rbar b{position:absolute;top:-3px;width:1px;height:10px;background:#8b95a3}
/* B */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:14px 16px}
.card{background:#fff;border:1px solid var(--line);padding:12px 14px 10px;border-top:3px solid var(--ac)}
.card:hover{border-color:#9db6d4}
.ch{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--tx3)}.ch .org{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{border:1px solid var(--line);padding:0 5px;color:var(--tx2)}
.dd{font-size:12px;color:var(--tx2)}
.card .ttl{font-weight:600;font-size:13.5px;margin-top:6px;line-height:1.35;height:36px;overflow:hidden}
.card .addr{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:grid;grid-template-columns:1fr 1.25fr .9fr;margin-top:10px;border-top:1px solid var(--line2);padding-top:8px}
.pr .l{font-size:10px;color:var(--tx3)}.pr .v{font:500 15px var(--mono)}
.cf{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding-top:6px;margin-top:6px}.cf svg{flex:1}
/* compact rows */
.crow{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 0;border-bottom:1px solid var(--line2);background:#fff;cursor:pointer}
.crow.sel{background:var(--ac-bg)}.crow:hover{background:#f5f8fc}
.cbar{width:3px;height:30px;flex:none}
.cm{flex:1;min-width:0}.cp{text-align:right;font-size:12px;display:flex;flex-direction:column;align-items:flex-end;min-width:74px}.cp span{font-size:11px}
.cd{width:48px;text-align:right;font-size:12px;color:var(--tx2)}
/* C */
.mapwrap{display:grid;grid-template-columns:420px 1fr;gap:0;height:100%}
.mapl{background:#fff;border-right:1px solid var(--line);padding:16px}
.tmap{display:grid;grid-template-columns:repeat(5,72px);grid-template-rows:repeat(7,58px);gap:4px}
.tile{display:flex;flex-direction:column;justify-content:center;padding:0 7px;cursor:pointer;border:1px solid transparent}
.tile b{font-size:11px;font-weight:600}.tile span{font:500 15px var(--mono)}.tile small{font-size:9.5px;opacity:.85}
.tile.sel{outline:2px solid #14243b;outline-offset:1px}
.legend2{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--tx3);margin-top:8px}.legend2 i{width:120px;height:6px}
.hb{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}.hb span{width:120px;flex:none;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb i{height:10px;background:#2463a8;display:block}.hb b{font-weight:500;font-size:12px;white-space:nowrap}.hb em{font-style:normal;font-size:11px;color:var(--tx3);margin-left:auto}
.mapr{display:grid;grid-template-rows:auto 1fr;min-height:0}
.rh{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line)}.rh h3{font-size:15px;margin-bottom:8px}
.clist{overflow:auto;background:#fff}
/* D */
.calwrap{display:grid;grid-template-columns:1fr 520px;height:100%}
.calL{padding:14px 16px;overflow:auto}.calR{background:#fff;border-left:1px solid var(--line);padding:14px 16px;overflow:auto}.calR h3{font-size:14px;margin-bottom:10px}
.cal{background:#fff;border:1px solid var(--line);margin-bottom:12px}.mh{padding:7px 10px;font-weight:600;border-bottom:1px solid var(--line)}
.cg{display:grid;grid-template-columns:repeat(7,1fr)}.dw{font-size:10px;color:var(--tx3);text-align:center;padding:3px;border-bottom:1px solid var(--line2)}
.dc{height:74px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:3px 5px;display:flex;flex-direction:column;gap:2px;font-size:10px}
.dc.e{background:#fafbfc}.dn{font:11px var(--mono);color:var(--tx2)}.dc.today .dn{background:#14243b;color:#fff;padding:0 4px;align-self:flex-start}

function exportAs(fmt){
  const sp=space();const its=items();
  const h=['상태','우선순위','구분','매물명','기관','위치','금액(원)','게시일','종료일','작업 시작','작업 마감','담당자','커스텀 필드','본문','코멘트 수','최근 코멘트','등록일'];
  const strip=s=>{const d=document.createElement('div');d.innerHTML=s||'';return d.textContent.replace(/\s+/g,' ').trim()};
  const rows=its.map(i=>[STN[i.status][1],PRN[i.priority][1],i.board,i.title,i.org,i.loc,i.amount??'',i.posted,i.end,i.start,i.due,i.owners.join(', '),Object.entries(i.custom).map(([k,v])=>k+': '+v).join(' / '),strip(i.body),i.comments.length,i.comments.length?strip(i.comments[i.comments.length-1].h):'',i.created.slice(0,10)]);
  const dl=async(blob,ext)=>{const filename=`${sp.name}_${new Date().toISOString().slice(0,10)}.${ext}`;
    let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(_){}
    if(d){try{await d.save({filename,data:blob});toast('내보냈습니다')}catch(e){toast('내보내기가 취소되었습니다')}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();toast('내보냈습니다')};
  if(fmt==='csv')dl(new Blob(['﻿'+[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n')],{type:'text/csv'}),'csv');
  if(fmt==='xls')dl(new Blob([`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1"><tr>${h.map(x=>`<th style="background:#14243b;color:#fff">${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((v,j)=>`<td${j===6?' style="mso-number-format:\'#,##0\'"':''}>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></body></html>`],{type:'application/vnd.ms-excel'}),'xls');
  if(fmt==='json')dl(new Blob([JSON.stringify({space:sp,items:its},null,1)],{type:'application/json'}),'json');
}
$('#wsset').onclick=()=>settings('general');
function settings(tab){
  const sp=space();
  const body=()=>`<h3>관리설정</h3><div class="seg2"><button data-t="general" class="${tab==='general'?'on':''}">일반</button><button data-t="members" class="${tab==='members'?'on':''}">멤버 ${sp.members.length}</button><button data-t="danger" class="${tab==='danger'?'on':''}">삭제</button></div>
   ${tab==='general'?`<label class="fld">이름 <i>*</i><input id="d_n" value="${esc(sp.name)}" maxlength="40"></label><label class="fld">설명<textarea id="d_d" rows="3">${esc(sp.desc||'')}</textarea></label><div class="note">만든 날 ${fmtAt(sp.created)} · 소유자 ${esc(sp.owner)}</div>`
   :tab==='members'?`<div class="fld">멤버 초대<div class="inv"><input id="d_m" placeholder="이름 또는 이메일"><select id="d_r"><option>편집자</option><option>뷰어</option></select><button id="d_add">초대</button></div><div class="note" style="margin-top:4px">지금은 이름만 등록됩니다. 팀원과 함께 보는 공유 기능은 곧 연결됩니다.</div></div>
     <ul class="mems">${sp.members.map((m,k)=>`<li><b class="av">${esc(m.name.slice(0,1))}</b><span>${esc(m.name)}</span><span class="sp"></span>${m.role==='소유자'?'<span class="note">소유자</span>':`<select data-mr="${k}"><option ${m.role==='편집자'?'selected':''}>편집자</option><option ${m.role==='뷰어'?'selected':''}>뷰어</option></select><button class="cdel" data-md="${k}" title="내보내기">×</button>`}</li>`).join('')}</ul>`
   :`<p>「${esc(sp.name)}」 워크스페이스와 안의 매물 ${items().length}건, 코멘트를 모두 삭제합니다. 되돌릴 수 없습니다.</p><label class="fld">확인을 위해 워크스페이스 이름을 입력하세요<input id="d_c" placeholder="${esc(sp.name)}"></label><button class="linkdanger" id="d_del" ${S.spaces.length<2?'disabled title="워크스페이스가 하나뿐이라 삭제할 수 없습니다"':''}>워크스페이스 삭제</button>`}`;
  const draw=()=>{dlg(body(),tab==='general'?'저장':null,()=>{const n=$('#d_n').value.trim();if(!n)return false;sp.name=n;sp.desc=$('#d_d').value.trim();log('워크스페이스 정보 수정');save();render()},()=>{
    $('#wdlg .seg2').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;draw()};
    const ad=$('#d_add');if(ad){const go=()=>{const n=$('#d_m').value.trim();if(!n)return;if(sp.members.some(m=>m.name===n)){toast('이미 멤버입니다');return}sp.members.push({name:n,role:$('#d_r').value});log(`멤버 ${n} 초대`);save();render();draw()};ad.onclick=go;$('#d_m').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};$('#d_m').focus()}
    $$('[data-mr]').forEach(s=>s.onchange=()=>{sp.members[+s.dataset.mr].role=s.value;save()});
    $$('[data-md]').forEach(b=>b.onclick=()=>{const m=sp.members[+b.dataset.md];sp.members.splice(+b.dataset.md,1);items().forEach(i=>i.owners=i.owners.filter(o=>o!==m.name));log(`멤버 ${m.name} 내보냄`);save();render();draw()});
    const dd=$('#d_del');if(dd)dd.onclick=()=>{if($('#d_c').value.trim()!==sp.name){$('#d_c').closest('.fld').classList.add('bad');return}S.items=S.items.filter(i=>i.space!==sp.id);S.spaces=S.spaces.filter(s=>s.id!==sp.id);S.cur=S.spaces[0].id;S.log=S.log.filter(l=>l.space!==sp.id);save();closeDlg();history.replaceState(null,'',`#space=${S.cur}`);render();toast('워크스페이스를 삭제했습니다')};
  },'mid')};draw();
}

$('#wsadd').onclick=()=>addForm();
function addForm(){
  let mode='quick';const custom={};const sp=space();let owners=[];
  const body=()=>`<h3>매물 추가</h3><div class="seg2"><button data-m="quick" class="${mode==='quick'?'on':''}">빠른 추가</button><button data-m="full" class="${mode==='full'?'on':''}">상세 추가</button></div>
   <div class="wscroll"><label class="fld">매물명 <i>*</i><input id="a_t" placeholder="예: 강남구 역삼동 복합개발"></label>
   <label class="fld">위치 <i>*</i><input id="a_l" placeholder="예: 서울시 강남구 역삼1동"></label>
   <div class="two"><label class="fld">대지 면적<span class="unit"><input id="a_la" inputmode="decimal" placeholder="예: 330.58"><em>㎡</em></span></label><label class="fld">건물 면적<span class="unit"><input id="a_ba" inputmode="decimal" placeholder="예: 198.34"><em>㎡</em></span></label></div>
   <label class="fld">금액 <i>*</i><span class="unit"><input id="a_a" inputmode="numeric" placeholder="예: 15,000,000,000"><em>원</em></span></label>
   <div class="two"><label class="fld">게시일 <i>*</i><input id="a_p" type="date"></label><label class="fld">종료일 <i>*</i><input id="a_e" type="date"></label></div>
   ${mode==='full'?`<div class="two"><label class="fld">시작일<input id="a_s" type="date"></label><label class="fld">마감일<input id="a_d" type="date"></label></div>
   <div class="two"><label class="fld">상태<select id="a_st">${ST.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label><label class="fld">우선순위<select id="a_pr">${PR.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select></label></div>
   <div class="fld">담당자 <span class="note">(${owners.length}/3)</span><div class="ownpick">${sp.members.map(m=>`<button data-o="${esc(m.name)}" class="${owners.includes(m.name)?'on':''}"><b class="av sm">${esc(m.name.slice(0,1))}</b>${esc(m.name)}</button>`).join('')}</div></div>
   <label class="fld">본문(설명)<textarea id="a_b" rows="3" placeholder="매물에 대한 설명을 입력하세요..."></textarea></label>
   <hr class="sep"><div class="fld"><b>커스텀 필드</b><div id="a_cf">${Object.keys(custom).map(k=>`<label class="cfrow"><span>${esc(k)}</span><input data-cf="${esc(k)}" value="${esc(custom[k])}"><button class="cdel" data-cfdel="${esc(k)}">×</button></label>`).join('')}</div>
   <div class="cfadd"><button data-cfnew="1">＋ 필드 추가 (${Object.keys(custom).length}/10)</button></div><div class="cfchips">${CUSTOM.filter(k=>!(k in custom)).map(k=>`<button data-cfadd="${k}">+ ${k}</button>`).join('')}</div></div>`:''}</div>`;
  const keep=()=>{const v={};$$('#wdlg input[id],#wdlg textarea[id],#wdlg select[id]').forEach(e=>v[e.id]=e.value);$$('#wdlg [data-cf]').forEach(e=>custom[e.dataset.cf]=e.value);return v};
  const restore=v=>Object.entries(v).forEach(([k,x])=>{const e=document.getElementById(k);if(e)e.value=x});
  const ok=()=>{const v=keep();const need=['a_t','a_l','a_a','a_p','a_e'];const miss=need.filter(k=>!String(v[k]||'').trim());
    $$('#wdlg .fld').forEach(f=>f.classList.remove('bad'));if(miss.length){miss.forEach(k=>document.getElementById(k).closest('.fld').classList.add('bad'));return false}
    if(v.a_e<v.a_p){$('#a_e').closest('.fld').classList.add('bad');toast('종료일이 게시일보다 빠릅니다');return false}
    const it=blank({title:v.a_t.trim(),loc:v.a_l.trim(),land:+v.a_la||null,bldg:+v.a_ba||null,amount:+String(v.a_a).replace(/[^\d]/g,'')||null,posted:v.a_p,end:v.a_e});
    if(mode==='full')Object.assign(it,{start:v.a_s||'',due:v.a_d||'',status:v.a_st,priority:v.a_pr,owners:[...owners],body:v.a_b?`<p>${esc(v.a_b).replace(/\n/g,'<br>')}</p>`:'',custom:Object.fromEntries(Object.entries(custom).filter(([k])=>k.trim()))});
    S.items.push(it);log(`「${it.title}」 직접 등록`);save();render()};
  const draw=v=>{dlg(body(),'추가',ok,null,'wide');v&&restore(v);
    const okb=$('#wdlg .wok');const chk=()=>okb.disabled=!['a_t','a_l','a_a','a_p','a_e'].every(k=>($('#'+k).value||'').trim());chk();$$('#wdlg input,#wdlg textarea').forEach(e=>e.addEventListener('input',chk));
    $('#wdlg .seg2').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=keep();mode=b.dataset.m;draw(v)};
    $$('#wdlg [data-cfadd]').forEach(b=>b.onclick=()=>{const v=keep();if(Object.keys(custom).length<10)custom[b.dataset.cfadd]='';else toast('커스텀 필드는 10개까지입니다');draw(v)});
    $$('#wdlg [data-cfdel]').forEach(b=>b.onclick=()=>{const v=keep();delete custom[b.dataset.cfdel];draw(v)});
    const nb=$('#wdlg [data-cfnew]');if(nb)nb.onclick=()=>{const v=keep();if(Object.keys(custom).length>=10){toast('커스텀 필드는 10개까지입니다');return}const n=prompt('필드 이름');if(n&&n.trim()&&!(n.trim() in custom))custom[n.trim()]='';draw(v)};
    $$('#wdlg [data-o]').forEach(b=>b.onclick=()=>{const v=keep();const n=b.dataset.o;owners=owners.includes(n)?owners.filter(o=>o!==n):owners.length<3?[...owners,n]:owners;draw(v)});
    const a=$('#a_a');a.oninput=()=>{const n=a.value.replace(/[^\d]/g,'');a.value=n?(+n).toLocaleString():'';chk()};$('#a_t').focus()};
  draw();
}

let csort=1,editing=null;
function detail(id){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  history.replaceState(null,'',`#space=${i.space}&item=${id}`);
  const rep=i.kind==='report',m=i.meta||{};
  const fmtMeta=(k,v)=>v==null||v===''?null:k==='최저입찰가'?`<b class="num">${won(v)}</b>`:k==='감정가 대비'?`${(v*100).toFixed(1)}%`:k==='유찰'?`${v}회`:k==='회차'?`${+v||v}회차`:esc(v);
  const info=rep?[]:[[ '공고기관',`${esc(i.org||'–')}${i.links[0]?` <a class="ext" href="${esc(i.links[0].u)}" target="_blank" rel="noopener" title="${esc(i.links[0].t)}">${I_.ext}</a>`:''}`],['위　　치',`${esc(i.loc||'–')}${mapLinks(i.loc)}`],['게 시 일',i.posted||'–'],['종 료 일',i.end?`${i.end} 마감`:'–'],['금　　액',won(i.amount)?`<b class="num">${won(i.amount)}</b>`:'<span class="note">금액 미정</span>'],
    ...(i.land||i.bldg?[['면　　적',[i.land?`대지 ${(+i.land).toLocaleString()}㎡`:'',i.bldg?`건물 ${(+i.bldg).toLocaleString()}㎡`:''].filter(Boolean).join(' · ')]]:[])];
  const metaRows=Object.entries(m).map(([k,v])=>[k,fmtMeta(k,v)]).filter(r=>r[1]!=null);
  const cs=i.comments.slice().sort((a,b)=>(a.at>b.at?1:-1)*csort);
  const prop=(ic,label,val,attr)=>`<button class="tprop" ${attr}>${ic}<span>${val||`<span class="note">${label}</span>`}</span></button>`;
  dlg(`<div class="th" data-id="${i.id}"><span class="btag ${TAGC[i.board]||'r'}">${esc(i.board)}</span><button class="tmenu" id="t_menu" aria-label="더보기">⋯</button><h2 contenteditable="true" spellcheck="false" id="t_title">${esc(i.title)}</h2>
    <div class="tprops">${prop(`<span class="sic" style="color:${STN[i.status][2]}">${I_[i.status]}</span>`,'상태',STN[i.status][1],'id="t_st"')}${prop(`<span class="sic" style="color:${PRN[i.priority][2]}">${I_[i.priority]}</span>`,'우선순위',PRN[i.priority][1],'id="t_pr"')}${prop(`<span class="sic">${I_.user}</span>`,'담당자',i.owners.join(', '),'id="t_ow"')}
     <label class="tprop">${I_.cal}<span class="note dl">시작일</span><input type="date" id="t_s" value="${i.start}"></label><label class="tprop">${I_.cal}<span class="note dl">마감일</span><input type="date" id="t_d" value="${i.due}"></label></div></div>
   <div class="tbody"><div class="tl">
    ${info.length?`<dl class="mi">${info.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:''}
    ${metaRows.length?`<dl class="mi ${info.length?'sub':''}">${metaRows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`:''}
    ${i.kind==='listing'?`<a class="golist" href="listings.html#${encodeURIComponent(i.ref)}">매물·공고에서 최신 정보 보기 ↗</a>`:''}
    <section class="tsec"><h5>본문 내용 <span class="note" title="공고 원문 요약과 검토 메모를 자유롭게 고칠 수 있습니다">ⓘ</span><span class="sp"></span><button class="fold">⌃</button></h5><div class="rte"><div class="rtb">${TB}</div><div class="rbody" id="t_b" contenteditable="true" data-ph="검토 메모, 공고 요약 등을 적어 두세요.">${sanitize(i.body)}</div></div></section>
    ${i.links.length?`<section class="tsec"><h5>첨부 문서 <span class="note">ⓘ</span><span class="sp"></span><button class="fold">⌃</button></h5><div>${i.links.map(l=>`<div class="att"><span>📎 ${esc(l.t)}</span><a href="${esc(l.u)}" target="_blank" rel="noopener">바로 가기</a></div>`).join('')}</div></section>`:''}
    <section class="tsec"><h5>커스텀 필드 <span class="note">${Object.keys(i.custom).length}/10</span><span class="sp"></span><button class="fold">⌃</button></h5><div>${Object.entries(i.custom).map(([k,v])=>`<label class="cfrow"><span>${esc(k)}</span><input data-tcf="${esc(k)}" value="${esc(v)}"><button class="cdel" data-tcfd="${esc(k)}">×</button></label>`).join('')}<div class="cfchips">${CUSTOM.filter(k=>!(k in i.custom)).map(k=>`<button data-tcfa="${k}">+ ${k}</button>`).join('')}</div></div></section>
    <div class="note" style="margin:14px 0 4px">등록 ${fmtAt(i.created)} · ${esc(i.by)} · 최근 수정 ${ago(i.updated)}</div></div>
   <div class="tr"><div class="trh"><b>코멘트</b><span class="kc num">${i.comments.length}</span><span class="sp"></span><button id="t_sort" class="note">${csort>0?'과거순 ↑':'최신순 ↓'}</button></div>
    <div class="clist2" id="t_cl">${cs.map(c=>`<div class="cm" data-c="${c.at}"><div class="cmh"><b class="av sm">${esc(c.by.slice(0,1))}</b><b>${esc(c.by)}</b><span class="note num">${fmtAt(c.at)}${c.ed?' · 수정됨':''}</span><span class="sp"></span>${c.by===ME?`<button class="cact" data-ce="${c.at}">수정</button><button class="cact" data-cd="${c.at}">삭제</button>`:''}</div><div class="cmb">${editing===c.at?`<div class="rte sm"><div class="rtb">${TB}</div><div class="rbody" id="t_ce" contenteditable="true">${sanitize(c.h)}</div></div><div class="ceb"><button data-cx="1">취소</button><button data-cs="${c.at}" class="pri">저장</button></div>`:sanitize(c.h)}</div></div>`).join('')||`<div class="cempty">${I_.chat}<div>아직 코멘트가 없습니다</div><small class="note">왜 보류했는지, 무엇을 더 봐야 하는지 남겨 두세요.<br>멤버를 @이름 으로 부를 수 있습니다.</small></div>`}</div>
    <div class="cin"><div class="rte"><div class="rbody" id="t_c" contenteditable="true" data-ph="코멘트를 입력하세요..."></div><div class="rtb bot">${TB}<span class="sp"></span><button id="t_send" class="send" title="등록 (Ctrl+Enter)">➤</button></div></div></div></div></div>`,null,null,()=>{
    const box=$('#wdlg .wbox');box.classList.add('task');box.dataset.id=id;
    const sv=(p,msg)=>{Object.assign(i,p);i.updated=now();if(msg)log(msg);save();render()};
    $('#t_st').onclick=e=>{e.stopPropagation();choose(e.currentTarget,ST.map(x=>[x[0],x[1],I_[x[0]],x[2]]),v=>setStatus(id,v))};
    $('#t_pr').onclick=e=>{e.stopPropagation();choose(e.currentTarget,PR.map(x=>[x[0],x[1],I_[x[0]],x[2]]),v=>upd(id,{priority:v},i=>`「${i.title}」 우선순위 ${PRN[v][1]}`))};
    $('#t_ow').onclick=e=>{e.stopPropagation();ownerMenu(e.currentTarget,id)};
    $('#t_s').onchange=e=>{if(i.due&&e.target.value>i.due){toast('시작일이 마감일보다 늦습니다');e.target.value=i.start;return}sv({start:e.target.value},`「${i.title}」 시작일 ${e.target.value||'삭제'}`);detail(id)};
    $('#t_d').onchange=e=>{if(i.start&&e.target.value&&e.target.value<i.start){toast('마감일이 시작일보다 빠릅니다');e.target.value=i.due;return}sv({due:e.target.value},`「${i.title}」 마감일 ${e.target.value||'삭제'}`);detail(id)};
    $('#t_title').onblur=e=>{const t=e.target.textContent.trim();if(t&&t!==i.title)sv({title:t},`제목 변경 → 「${t}」`);else e.target.textContent=i.title};
    $('#t_title').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}};
    $('#t_b').onblur=e=>{const h=sanitize(e.target.innerHTML);if(h!==i.body)sv({body:h})};
    $('#t_menu').onclick=e=>{e.stopPropagation();cardMenu(e.currentTarget,id)};
    $$('#wdlg .fold').forEach(b=>b.onclick=()=>b.closest('.tsec').classList.toggle('closed'));

const sec=(t,body,extra='')=>`<section class="ms"><button class="msh" aria-expanded="true"><span>${t}${extra}</span><svg viewBox="0 0 12 12"><path d="m3 7.5 3-3 3 3"/></svg></button><div class="msb">${body}</div></section>`;
function open(id,noPush){
  const x=I.find(i=>i.id===id);if(!x)return;const p=x.prices||{};
  const link=x.lh?x.url:(x.url||'https://www.onbid.co.kr');
  const info=[['처분 기관',`${esc(x.org)} <span class="note">${esc(x.org_type)}</span>`],['소재지',esc(x.address||x.region)],
    x.lh?['공고일',x.posted||'–']:(x.dday==null&&x.pvct_since?['입찰 기간','입찰 종료 · <b>수의계약으로 매수 가능</b> <span class="note">(기관에 문의)</span>']:['입찰 기간',`${x.bid_start||''} ${x.bid_start_time||''} ~ ${x.deadline||''} ${x.deadline_time||''}`]),
    x.dday==null&&x.pvct_since?['마지막 유찰',`${x.pvct_since}${x.modified?` <span class="note">· 온비드 최종 수정 ${x.modified}</span>`:''}`]:[x.lh?'접수 마감':'입찰 마감',`${x.deadline||'–'} <b class="${x.dday!=null&&x.dday<=3?'hot':''}">${dd(x.dday)}</b>`],
    x.lh?['공급 예정가',(x.supply!=null?`<b class="num">${won(x.supply)}</b>`:'<span class="note">공급정보 수집 대기</span>')]:['감정가',`<b class="num">${won(x.apsl)}</b>`],
    ...(x.lh?[]:[['최저입찰가',`<b class="num">${x.minb!=null?won(x.minb):'비공개'}</b> <span class="note">${+x.round||''}회차 · 감정가 대비 <span style="color:${rc(x.ratio)}">${pct(x.ratio)??'–'}</span></span>`]])];
  let h=`<div class="mh"><div class="mt"><span class="tag ${x.lh?'lhb':'onb'}">${x.board} · ${x.lh?'LH':'온비드'}</span><span class="tag">${esc(x.cat)}</span>${x.pvct?'<span class="tag pv">수의계약 가능</span>':''}<h2 id="mtitle">${esc(x.title)}</h2></div><button class="mx" aria-label="닫기">×</button></div>
  <div class="mbody"><dl class="mi">${info.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  <div class="mact">${inWs(x.id).length?`<button data-act="go" class="ib wide added" title="워크스페이스에서 열기">✓ 워크스페이스 · 열기</button>`:`<button data-act="add" class="ib wide" title="워크스페이스에 추가">＋ 워크스페이스에 추가</button>`}<button data-act="hid" class="ib" title="숨김">${hid.has(x.id)?'↺':'⊘'}</button><button data-act="share" class="ib" title="링크 복사">⎘</button><span class="sp"></span><a class="go" href="${esc(link)}" target="_blank" rel="noopener">↗ ${x.lh?'LH청약플러스 원문':'온비드에서 보기'}</a></div>`;
  if(!x.lh){
    const rs=x.rounds||[];
    if(chart(x))h+=sec('회차별 최저입찰가',chart(x)+`<div class="calc">유찰되면 다음 회차로 넘어가며 최저입찰가가 낮아집니다. 크게 표시된 점이 다음 입찰 회차입니다.</div>`);
    h+=sec('입찰 일정',`<table class="tt"><thead><tr><th>회차</th><th>입찰 시작</th><th>입찰 마감</th><th class="r">최저입찰가</th><th class="r">감정가 대비</th><th>상태</th></tr></thead><tbody>${rs.map(r=>{const on=String(r.round)===String(x.round);return `<tr class="${on?'cur':''}"><td class="num">${+r.round||esc(r.round)}</td><td class="num">${r.bid_start||''} ${r.bid_start_time||''}</td><td class="num">${r.deadline||''} ${r.deadline_time||''}</td><td class="r num">${r.min_bid!=null?won(r.min_bid):esc(r.min_bid_text||'–')}</td><td class="r num" style="color:${rc(r.to_appraisal)}">${pct(r.to_appraisal)??'–'}</td><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.stat||'보기')} ↗</a>`:esc(r.stat||'')}</td></tr>`}).join('')}</tbody></table>`,` <span class="note">${rs.length}개 회차</span>`);
    h+=sec('물건 정보',`<dl class="kv"><dt>용도</dt><dd>${esc(x.category)} · ${esc(x.kind)}</dd><dt>토지 면적</dt><dd class="num">${x.land_sqm!=null?x.land_sqm.toLocaleString()+' ㎡ ('+pyeong(x.land_sqm)+')':'–'}</dd><dt>건물 면적</dt><dd class="num">${x.bldg_sqm?x.bldg_sqm.toLocaleString()+' ㎡ ('+pyeong(x.bldg_sqm)+')':'–'}</dd><dt>재산 유형</dt><dd>${esc(x.property_type)}${x.share?' · 지분 매각':''}</dd><dt>유찰 횟수</dt><dd>${x.failed_bids??'–'}회</dd><dt>물건관리번호</dt><dd><button class="cpchip num" data-copy="${esc(x.ref.cltr_mng_no)}" title="물건관리번호 복사">${esc(x.ref.cltr_mng_no)}${CPI}</button></dd></dl>`);
  }else{
    h+=sec('상세 대상',x.parcels&&x.parcels.length?`<table class="tt"><thead><tr><th>순번</th><th>용도</th><th>소재지</th><th class="r">금액</th><th class="r">면적</th></tr></thead><tbody>${x.parcels.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${esc(r.use)}</td><td>${esc(r.address)} ${esc(r.lot)}</td><td class="r num">${won(r.price)??'–'}</td><td class="r num">${r.area_sqm?r.area_sqm.toLocaleString()+' ㎡':'–'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">필지·예정가격은 LH 공급정보 API에서 다음 수집 때부터 채워집니다.</div>');
    h+=sec('공고 정보',`<dl class="kv"><dt>공고 상태</dt><dd>${esc(x.status)}</dd><dt>유형</dt><dd>${esc(x.category)} · ${esc(x.kind)}</dd><dt>공고 번호</dt><dd class="num">${esc(x.ref.pan_id)}</dd></dl>`);
  }
  h+=sec('첨부 문서','<div class="empty">공고문·감정평가서 등 첨부 문서는 기관 원문 페이지에서 확인하세요. (API로 제공되지 않음)</div>');
  h+=`<div class="note src">출처: ${x.lh?'LH 분양임대공고 · 공급정보 API':'한국자산관리공사 온비드 부동산 물건목록 API'} · 수집 ${D.updated.slice(0,10)}${x.first_seen?' · 최초 확인 '+x.first_seen:''}</div></div>`;
  const was=$('#split').classList.contains('open')&&$('#modal').dataset.id!==id;
  $('#modal').innerHTML=h;$('#split').classList.add('open');
  if(was&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&$('#modal').animate)$('#modal').animate([{opacity:.35,transform:'translateX(16px)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.4,0,.2,1)'});$('#modal').scrollTop=0;$('#modal').dataset.id=id;markSel(true);
  if(!noPush)try{history.pushState({id},'','#'+encodeURIComponent(id))}catch(e){}
  $('#modal .mx').focus({preventScroll:true});
}
function markSel(scroll){const id=$('#split').classList.contains('open')?$('#modal').dataset.id:null;$$('.card').forEach(c=>{const on=c.dataset.id===id;c.classList.toggle('sel',on);if(on&&scroll)c.scrollIntoView({block:'nearest',behavior:'smooth'})})}
function close(noPop){if(!$('#split').classList.contains('open'))return;$('#split').classList.remove('open');$('#modal').dataset.id='';markSel();if(!noPop)try{history.pushState({},'',location.pathname+location.search)}catch(e){}}
$('#side').addEventListener('click',e=>{
  if(e.target.closest('.mx'))return close();
  const sh=e.target.closest('.msh');if(sh){const s=sh.parentElement;s.classList.toggle('closed');sh.setAttribute('aria-expanded',!s.classList.contains('closed'));return}
  const cp=e.target.closest('[data-copy]');if(cp){try{navigator.clipboard.writeText(cp.dataset.copy).catch(()=>{})}catch(_){}cp.classList.add('on');cp.querySelector('svg').outerHTML=CPOK;clearTimeout(cp._t);cp._t=setTimeout(()=>{cp.classList.remove('on');cp.querySelector('svg').outerHTML=CPI},1500);return}
  const a=e.target.closest('button[data-act]');if(!a)return;const id=$('#modal').dataset.id;
  if(a.dataset.act==='add'){const x=I.find(i=>i.id===id);WS().pick(a,WS().fromListing(x),()=>{render(true);open(id,true)});return}
  if(a.dataset.act==='go'){const w=inWs(id)[0];WS().open(w.space,w.id);return}
  if(a.dataset.act==='hid'){toggle(hid,'argus.hid',id);render(true);close()}
  if(a.dataset.act==='share'){try{navigator.clipboard.writeText(location.href)}catch(_){}a.textContent='✓';setTimeout(()=>a.textContent='⎘',1200)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
addEventListener('popstate',()=>{const id=decodeURIComponent(location.hash.slice(1));id?open(id,true):close(true)});
document.addEventListener('ws:change',()=>render(true));addEventListener('storage',e=>{if(e.key&&e.key.startsWith('argus.ws'))render(true)});
render();
if(location.hash)open(decodeURIComponent(location.hash.slice(1)),true);
})();
</script></body></html>
