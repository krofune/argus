  async function load(){const r=await sb.from('profiles').select('*').order('created_at',{ascending:false});if(r.error){say(r.error.message);return}rows=r.data;
    const since=new Date(Date.now()-30*864e5).toISOString();const a=await sb.from('activity_log').select('user_id,action').gte('at',since).in('action',['login','download']).limit(10000);
    stat={};(a.data||[]).forEach(x=>{const s=stat[x.user_id]=stat[x.user_id]||{login:0,download:0};s[x.action]++});
    const fu=document.getElementById('f-u');fu.innerHTML='<option value="">전체 회원</option>'+rows.map(x=>`<option value="${x.id}">${esc(x.name||'')} · ${esc(x.email)}</option>`).join('');draw()}
  function draw(){
    ['pending','approved','rejected'].forEach(s=>document.getElementById('n-'+s).textContent=rows.filter(x=>x.status===s).length);
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===tab));
    const a=rows.filter(x=>x.status===tab);
    document.getElementById('tb').innerHTML=a.map(x=>`<tr data-id="${x.id}"><td><div class="u">${x.avatar?`<img src="${esc(x.avatar)}" referrerpolicy="no-referrer" alt="">`:`<i>${esc((x.name||x.email||'?').slice(0,1))}</i>`}<div>${esc(x.name||'')}${x.role==='admin'?' <span class="st approved">관리자</span>':''}</div></div></td>
      <td class="mono">${esc(x.email)}</td><td class="mono">${d(x.created_at)}</td><td class="mono">${d(x.last_seen)}</td><td class="mono">${(stat[x.id]||{}).login||0}회 · ${(stat[x.id]||{}).download||0}건 <button class="lk" data-log="${x.id}">기록 보기</button></td><td><span class="st ${x.status}">${{pending:'승인 대기',approved:'승인됨',rejected:'거절'}[x.status]}</span></td>
      <td><input class="memo" value="${esc(x.memo||'')}" placeholder="소속·관계 등"></td>
      <td class="act">${x.id===profile.id?'<span class="mono">본인</span>':
        x.status==='pending'?'<button class="ok" data-a="approved">승인</button><button class="no" data-a="rejected">거절</button>':
        x.status==='approved'?`<button class="no" data-a="rejected">이용 중지</button>${x.role==='admin'?'<button data-a="member">관리자 해제</button>':'<button data-a="admin">관리자 지정</button>'}<button data-a="pw">임시 비밀번호</button>`:
        '<button class="ok" data-a="approved">승인</button>'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">해당하는 회원이 없습니다</td></tr>';
  }
  document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.s;draw()}};
  document.getElementById('tb').onclick=async e=>{const lg=e.target.closest('[data-log]');if(lg){show('a');document.getElementById('f-u').value=lg.dataset.log;loadA(true);return}
    const b=e.target.closest('button[data-a]');if(!b)return;const tr=b.closest('tr'),x=rows.find(r=>r.id===tr.dataset.id),a=b.dataset.a;
    if(a==='pw'){const pw=prompt(`${x.email} 계정의 임시 비밀번호 (8자 이상). 회원에게 전달한 뒤 로그인해서 바꾸도록 안내하세요.`);if(!pw)return;const r=await sb.rpc('admin_set_password',{target:x.id,new_password:pw});say(r.error?r.error.message:'임시 비밀번호를 정했습니다');return}
    if(a==='rejected'&&!confirm(`${x.email} 계정의 이용을 막을까요?`))return;
    const st=a==='admin'||a==='member'?x.status:a,role=a==='admin'?'admin':a==='member'?'member':null;
    const r=await sb.rpc('set_member',{target:x.id,new_status:st,new_role:role,new_memo:tr.querySelector('.memo').value});
    if(r.error){say(r.error.message);return}say('저장했습니다');load()};
  document.getElementById('tb').addEventListener('change',async e=>{if(!e.target.classList.contains('memo'))return;const tr=e.target.closest('tr'),x=rows.find(r=>r.id===tr.dataset.id);
    const r=await sb.rpc('set_member',{target:x.id,new_status:x.status,new_role:null,new_memo:e.target.value});say(r.error?r.error.message:'메모를 저장했습니다')});
  // 활동 기록
  const AL={login:'로그인',view:'페이지 열람',download:'다운로드',open:'원문·링크 열기'};let aRows=[],page=0;const PG=200;
  function show(v){document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.getElementById('v-m').style.display=v==='m'?'':'none';document.getElementById('v-a').style.display=v==='a'?'':'none'}
  document.getElementById('views').onclick=e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.v);if(b.dataset.v==='a'&&!aRows.length)loadA(true)};
  async function loadA(reset){if(reset){aRows=[];page=0}
    const u=document.getElementById('f-u').value,ac=document.getElementById('f-a').value,dd=+document.getElementById('f-d').value;
    let q=sb.from('activity_log').select('*').gte('at',new Date(Date.now()-dd*864e5).toISOString()).order('at',{ascending:false}).range(page*PG,page*PG+PG-1);
    if(u)q=q.eq('user_id',u);if(ac)q=q.eq('action',ac);const r=await q;if(r.error){say(r.error.message);return}
    aRows=aRows.concat(r.data);page++;document.getElementById('f-more').style.display=r.data.length===PG?'':'none';drawA()}
  function drawA(){const nm=id=>{const p=rows.find(x=>x.id===id);return p?(p.name||p.email):'(탈퇴)'};
    const c=k=>aRows.filter(x=>x.action===k).length;
    document.getElementById('sum').innerHTML=`<div><b>${new Set(aRows.map(x=>x.user_id)).size}</b><span>활동한 회원</span></div><div><b>${c('login')}</b><span>로그인</span></div><div><b>${c('view')}</b><span>페이지 열람</span></div><div><b>${c('download')}</b><span>다운로드</span></div>`;
    document.getElementById('ta').innerHTML=aRows.map(x=>`<tr><td class="mono">${d(x.at)}</td><td>${esc(nm(x.user_id))}<div class="mono">${esc(x.email||'')}</div></td><td><span class="ac ${x.action}">${AL[x.action]||x.action}</span></td><td class="tgt">${x.action==='open'?`<a href="${esc(x.target)}" target="_blank" rel="noopener">${esc((x.meta&&x.meta.text)||x.target)}</a>`:esc(x.target||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">기록이 없습니다</td></tr>'}
  ['f-u','f-a','f-d'].forEach(id=>document.getElementById(id).onchange=()=>loadA(true));
  document.getElementById('f-more').onclick=()=>loadA(false);
  document.getElementById('f-csv').onclick=()=>{const nm=id=>{const p=rows.find(x=>x.id===id);return p?(p.name||''):''};
    const csv='\ufeff'+[['시각','이름','이메일','기록','대상'],...aRows.map(x=>[new Date(x.at).toLocaleString('ko-KR'),nm(x.user_id),x.email||'',AL[x.action]||x.action,x.target||''])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='argus_활동기록.csv';a.click()};
  await load();
});
</script></body></html>
