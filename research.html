<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280">
<title>Argus Research · 리서치 센터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--top:#14243b;--bg:#eef1f5;--line:#dbe0e7;--line2:#e9edf2;--tx:#1d2733;--tx2:#5b6675;--tx3:#8b95a3;--ac:#2463a8;--ac-bg:#e8f0fa;--ac2:#1a4f8a;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 'IBM Plex Sans KR',system-ui,sans-serif;color:var(--tx);background:var(--bg);display:grid;grid-template-rows:40px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
*{scrollbar-width:thin;scrollbar-color:#cfd5dd transparent}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#d3d9e0}::-webkit-scrollbar-thumb:hover{background:#aeb7c3}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{background:var(--top);color:#dfe7f1;display:flex;align-items:center;gap:14px;padding:0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff}.brand small{font-weight:400;color:#8fa3bd;margin-left:-3px}
.top .sep{width:1px;height:18px;background:#2c4263}.top .crumb{color:#a9b9cd}.top .crumb b{color:#fff;font-weight:500}.top .sp{flex:1}.top .meta{color:#8fa3bd;font-size:12px}
.main{display:grid;grid-template-columns:52px 1fr;min-height:0}
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rail a{width:44px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:10px;border-left:2px solid transparent}
.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}.rail a.on{color:var(--ac);border-left-color:var(--ac);background:var(--ac-bg)}
.work{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.ph{background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:flex-end;gap:22px;height:44px}
.ph h1{font-size:15px;font-weight:600;align-self:center}
.tabs{display:flex;gap:20px;align-self:stretch}.tabs a{border-bottom:2px solid transparent;color:var(--tx2);display:flex;align-items:center}.tabs a.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}.tabs a.dis{color:#b4bcc7;cursor:default}
/* 하우스별 */
.rxh{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
.rxl{background:#fff;border-right:1px solid var(--line);overflow:auto}.rxlh{padding:12px 14px 8px;font-size:11.5px;color:var(--tx3);border-bottom:1px solid var(--line)}.rxlh span{margin-left:4px}
.rxl a{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:8px 14px;border-bottom:1px solid #f0f2f5;color:var(--tx);text-decoration:none;font-size:12.5px}.rxl a:hover{background:#f6f8fa}
.rxl a.on{background:#eef3fa;box-shadow:inset 2px 0 0 var(--ac)}.rxl a .n{color:var(--tx2);font-size:11.5px}.rxl a .d{grid-column:1/-1;color:var(--tx3);font-size:10.5px}
.rxm{overflow:auto;padding:16px 22px;background:#fff}.rxmh h2{font-size:18px;margin:0 0 2px}.rxchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}.rxchips span{border:1px solid var(--line);font-size:11.5px;padding:2px 8px;color:var(--tx2)}.rxchips b{color:var(--tx);font-weight:500}
.rxy h4{font-size:12.5px;margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}.rxy h4 span{color:var(--tx3);font-weight:400;margin-left:4px}
.rxy ul,.rxday ul{list-style:none;margin:0;padding:0}
.rxr{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid #f0f2f5;position:relative}.rxr .tt{font-size:13px;color:var(--tx);text-decoration:none}.rxr a.tt:hover{color:var(--ac);text-decoration:underline}
.rxr .rxb{flex:1;min-width:0}.rxd{width:78px;flex:none;color:var(--tx3);font-size:11.5px;padding-top:2px}.rxc{color:var(--tx2)}
.rxr .wsadd.mini{position:static;flex:none;width:24px;height:22px;font-size:13px;opacity:.35}.rxr:hover .wsadd.mini,.rxr .wsadd.mini.added{opacity:1}
/* 발간 피드 */
.rxf,.rxcov{height:100%;overflow:auto;background:#fff}
.rxfh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.rxseg{display:inline-flex;border:1px solid var(--line)}.rxseg button{border:0;border-right:1px solid var(--line);background:#fff;padding:0 10px;height:26px;font:inherit;font-size:12px;color:var(--tx2);cursor:pointer}.rxseg button:last-child{border-right:0}.rxseg button.on{background:#e9f0f8;color:var(--ac);font-weight:600}
.rxcat{display:flex;flex-wrap:wrap;gap:4px}.rxcat button{border:1px solid var(--line);background:#fff;font:inherit;font-size:11.5px;padding:2px 8px;cursor:pointer;color:var(--tx2)}.rxcat button.on{border-color:#14243b;color:#14243b;font-weight:600}.rxcat .num{color:var(--tx3);font-size:10.5px}
.rxtl{padding:6px 22px 30px}.rxday{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.rxdl{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--tx2);position:sticky;top:60px;align-self:start}.rxdl b{font-size:18px;color:var(--tx)}
.rxhs{width:140px;flex:none;font-size:12px;color:var(--tx2);padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 커버리지 */
.rxcw{padding:14px 22px 30px;overflow:auto}.rxct{border-collapse:separate;border-spacing:3px;font-size:12px}
.rxct th{font-weight:500;color:var(--tx3);padding:4px 6px;font-size:11.5px;white-space:nowrap}.rxct th.l,.rxct td.l{text-align:left;min-width:150px}
.rxct td{text-align:center;min-width:78px;height:42px;cursor:pointer;position:relative;line-height:1.25}.rxct td b{display:block;font-size:13px}.rxct td span{font-size:10px;opacity:.8}
.rxct td.z{cursor:default;color:#c0c7d1;background:#f7f8fa}.rxct td.l{cursor:default}.rxct td.l a{color:var(--tx);text-decoration:none}.rxct td.l a:hover{color:var(--ac)}
.rxct td i,.dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#2e9a62}.dot{position:static;display:inline-block;vertical-align:middle}
.rxct td.t{cursor:default;font-weight:600;background:#f6f8fa}.rxct tr.sum td{cursor:default;background:#f6f8fa;color:var(--tx2);font-weight:600;height:30px}
.rxct td[data-h]:hover{outline:2px solid #14243b;outline-offset:-1px}
/* 마켓 사운딩 */
.rxms{position:relative;height:100%;overflow:hidden}.dprev{padding:16px;display:grid;gap:14px;filter:blur(3px);opacity:.75}
.dg3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.dg2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.dcard,.dpanel{background:#fff;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}.dpanel{min-height:300px}
.sk{background:linear-gradient(90deg,#e6eaf0,#f1f3f6,#e6eaf0);background-size:200% 100%;animation:skm 2.4s ease-in-out infinite}@keyframes skm{0%{background-position:100% 0}100%{background-position:-100% 0}}
.dbars{flex:1;display:flex;align-items:flex-end;gap:8px;padding-top:12px}.dbars i{flex:1;background:#d5dde8}.drow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #eef1f5}
.dveil{position:absolute;inset:0;background:rgba(238,241,245,.55);display:flex;align-items:center;justify-content:center}
.dmsg{background:#fff;border:1px solid var(--line);border-top:3px solid #14243b;box-shadow:0 18px 50px rgba(20,35,58,.12);padding:30px 36px;text-align:center;max-width:470px}
.dmsg h2{font-size:18px;font-weight:600;margin:14px 0 8px;color:#14243b}.dmsg p{font-size:13px;line-height:1.75;color:var(--tx2);margin:0}
.dic{display:flex;gap:6px;justify-content:center}.dic span{width:8px;height:8px;border-radius:50%;background:#2463a8;animation:dot 1.2s ease-in-out infinite}.dic span:nth-child(2){animation-delay:.15s}.dic span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.dlinks{display:flex;gap:8px;justify-content:center;margin-top:18px}.dlinks a{border:1px solid var(--line);padding:6px 12px;font-size:12.5px;color:var(--tx);text-decoration:none}.dlinks a:hover{border-color:#14243b}
@media (prefers-reduced-motion:reduce){.sk,.dic span{animation:none}}
.ph .sp{flex:1}
.srch{align-self:center;display:flex;align-items:center;gap:6px;border:1px solid var(--line);height:26px;padding:0 8px;width:280px;color:var(--tx3);background:#fff}
.srch:focus-within{border-color:#9db6d4}.srch input{border:0;outline:0;font:inherit;width:100%;color:var(--tx);background:#fff}
#view{min-height:0;overflow:hidden}
.src{display:inline-block;font-size:10px;padding:0 4px;line-height:15px;border:1px solid;white-space:nowrap}
.src.p{color:#7b5bc4;border-color:#c9b8ef;background:#f6f2fe}.src.o{color:var(--ac);border-color:#bcd0e8;background:#f2f7fd}.src.b{color:#6b7684;border-color:#d4d9e0;background:#f6f7f9}.src.n{color:#a3abb6;border-color:#e2e6eb;background:#fff}
.wk{font-size:10px;color:var(--ac2);border:1px solid #9db6d4;padding:0 4px;line-height:15px;font-weight:500;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:11px;color:var(--tx3);align-items:center;flex-wrap:wrap}
.meta2{font-size:11px;color:var(--tx3);display:flex;gap:6px;align-items:center;margin-top:2px;white-space:nowrap;overflow:hidden}
.meta2 i{width:2px;height:2px;background:#b9c1cc;border-radius:50%;flex:none}
/* home */
.home{height:100%;overflow:auto;padding:16px 18px 24px}
.home .hd{display:flex;align-items:center;gap:16px;margin-bottom:10px}.home .hd h2{font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line2);background:#f8f9fb}
.card .ch b{font-size:12.5px;font-weight:600}.card .ch a{font-size:11px;color:var(--tx3)}.card .ch a:hover{color:var(--ac)}
.card ul{list-style:none;padding:0 12px}.card li{padding:6px 0;border-bottom:1px solid var(--line2)}.card li:last-child{border-bottom:0}
.card .tt{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card a.tt:hover{color:var(--ac);text-decoration:underline}
/* detail */
.dd{display:grid;grid-template-columns:220px 1fr;height:100%;min-height:0}
.lf{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 0 30px}
.lf .fg h4{font-size:11px;color:var(--tx3);font-weight:500;padding:8px 14px 4px;letter-spacing:.3px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.lf .fg h4 span{font:400 13px var(--mono)}
.lf .fg+.fg{border-top:1px solid var(--line2)}
.lf .fg.closed ul{display:none}
.lf ul{list-style:none;padding-bottom:4px}
.lf li{display:flex;align-items:center;gap:7px;padding:3px 14px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.lf li:hover{color:var(--tx)}
.lf li .cb{width:12px;height:12px;border:1px solid #aab4c1;flex:none;display:grid;place-items:center;background:#fff}
.lf li.on .cb{background:var(--ac);border-color:var(--ac)}
.lf li.on .cb:after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(0,-1px)}
.lf li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lf li .ct{font:11px var(--mono);color:var(--tx3)}
.lf li.zero{opacity:.45}
.lf .more{font-size:11px;color:var(--ac);padding:2px 14px 4px 33px;cursor:pointer}
.lf .reset{display:flex;justify-content:space-between;align-items:center;padding:2px 10px 6px 10px;font-size:11px;color:var(--tx3);border-bottom:1px solid var(--line2)}.lf .reset button{color:var(--ac);font-size:11px}
.rt{display:grid;grid-template-rows:auto auto auto auto 1fr auto;min-height:0;background:#fff;min-width:0}
.bc{padding:12px 18px 0;font-size:12px;color:var(--tx3)}.bc a:hover{color:var(--ac)}.bc b{color:var(--tx);font-weight:500}
.dh2{padding:6px 18px 10px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dh2 h2{font-size:18px;font-weight:600}.dh2 .s{font-size:12px;color:var(--tx3);padding-bottom:3px}
.subs{display:flex;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.subs button{padding:7px 14px;font-size:12.5px;color:var(--tx2);border:1px solid transparent;border-bottom:0;margin-bottom:-1px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.subs button .n{font:11px var(--mono);color:var(--tx3)}
.subs button.on{background:#fff;border-color:var(--line);color:var(--tx);font-weight:600;box-shadow:inset 0 2px 0 var(--ac)}
.hl{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:#f8f9fb}
.hl>div{padding:9px 18px;border-right:1px solid var(--line2);min-width:0}.hl>div:last-child{border-right:0}
.hl .l{font-size:10.5px;color:var(--tx3)}.hl .t{font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}
th{position:sticky;top:0;z-index:2;background:#f6f8fa;font-weight:500;color:var(--tx2);font-size:11px;text-align:left;padding:0 10px;height:28px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th .ar{color:var(--ac);margin-left:3px}
td{padding:0 10px;height:31px;border-bottom:1px solid var(--line2);white-space:nowrap;font-size:12.5px}
tr:hover td{background:#f5f8fc}
td.t{max-width:520px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
td.t a:hover{color:var(--ac);text-decoration:underline}
td.m{color:var(--tx2)}
.sc{display:inline-block;font-size:11px;color:var(--tx2);border:1px solid var(--line);padding:0 6px;line-height:17px}
.foot{border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:6px 14px;font-size:12px;color:var(--tx2)}
.foot .sp{flex:1}.note{font-size:11px;color:var(--tx3)}
.pg{display:flex;gap:2px;align-items:center}.pg button{min-width:24px;height:22px;border:1px solid transparent;font:12px var(--mono);color:var(--tx2)}
.pg button.on{border-color:var(--line);color:var(--tx);font-weight:500}.pg button:disabled{opacity:.35;cursor:default}.pg .gap{min-width:18px;text-align:center;color:var(--tx3);font:12px var(--mono)}
.psel{position:relative}.psel>button{height:24px;border:1px solid var(--line);padding:0 8px 0 10px;display:flex;align-items:center;gap:8px;font-size:12px}
.psel ul{display:none;position:absolute;right:0;bottom:calc(100% + 3px);background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(20,36,59,.1);list-style:none;z-index:20;padding:3px 0;min-width:100%}
.psel.open ul{display:block}.psel li{padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap}.psel li:hover{background:#f3f6fa}.psel li.on{color:var(--ac);font-weight:600;background:var(--ac-bg)}
.dd{transition:grid-template-columns .18s ease}
.dd.nof{grid-template-columns:46px 1fr}
.dd.nof .lf{overflow:hidden}
.dd.nof .lf>*:not(.reset),.dd.nof .reset span,.dd.nof #rst{display:none}
.dd.nof .reset{border-bottom:0;justify-content:center;padding:4px 0}
.reset .l{display:flex;align-items:center;gap:8px}
.sbt{width:26px;height:24px;display:grid;place-items:center;border:1px solid var(--line);color:var(--tx2);flex:none;background:#fff}
.sbt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.sbt:hover{color:var(--tx);border-color:#b9c2ce}
.sbt.on{background:var(--ac-bg);color:var(--ac2);border-color:#c6d6ea}
.sbt.on svg .fill{fill:currentColor}
.empty{padding:30px;text-align:center;color:var(--tx3)}
@media (max-width:900px){.main{grid-template-columns:1fr}.rail,.top .crumb,.top .sep,.top .meta{display:none}.grid{grid-template-columns:1fr}.dd{grid-template-columns:1fr}.lf{display:none}.hl{grid-template-columns:1fr 1fr}.srch{width:160px}.ph .tabs{display:none}.foot .note{display:none}.psel>button{white-space:nowrap}}
/* 워크스페이스 공용 (메뉴·토스트·대화상자) */
.wmenu{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px rgba(20,36,59,.16);padding:5px;min-width:190px;border-radius:8px}
.wmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;font-size:12.5px;color:var(--tx);border-radius:5px}
.wmenu button:hover{background:#f2f5f9}.wmenu button .note{margin-left:auto}
.wmenu button.chk{background:#eef3fa}.wmenu button.chk:after{content:"✓";margin-left:auto;color:var(--ac)}
.wmenu button.has{color:var(--tx2)}
.wmenu .danger{color:#c62828}.wmenu hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.wmenu .mh5{font-size:11px;color:var(--tx3);padding:5px 9px 4px}
.mic{width:16px;display:inline-grid;place-items:center;flex:none}.mic svg{width:14px;height:14px}
.wtoast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#14243b;color:#fff;padding:10px 16px;font-size:12.5px;z-index:300;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .18s ease}
.wtoast a{color:#9cc6f2;margin-left:6px;font-weight:600;text-decoration:none}.wtoast a:hover{text-decoration:underline}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
#wdlg{position:fixed;inset:0;background:rgba(14,24,40,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
#wdlg.open{display:flex}
.wbox{background:#fff;width:440px;max-width:100%;max-height:92vh;overflow:auto;padding:22px 24px 20px;position:relative;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.wbox.mid{width:560px}.wbox.wide{width:640px;display:flex;flex-direction:column;padding-bottom:0}
.wbox h3{font-size:17px;font-weight:600;margin-bottom:4px}.wbox>p{font-size:13px;color:var(--tx2);margin:8px 0}
.wx{position:absolute;right:16px;top:14px;font-size:22px;color:var(--tx3);line-height:1;z-index:2}.wx:hover{color:var(--tx)}
.fld{display:block;font-size:12.5px;font-weight:500;margin-top:14px;color:var(--tx)}.fld i{color:#d93838;font-style:normal}
.fld input,.fld textarea,.fld select,.inv input,.inv select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font:inherit;font-size:13px;color:var(--tx);background:#fff;outline:0;font-weight:400}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:#14243b}
.fld.bad input,.fld.bad textarea{border-color:#d93838;background:#fff7f7}
.unit{position:relative;display:block}.unit input{text-align:right;padding-right:34px}.unit em{position:absolute;right:11px;top:15px;font-style:normal;color:var(--tx2);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wfoot{display:flex;gap:10px;margin:20px -24px 0;padding:14px 24px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}
.wfoot button{flex:1;height:40px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-weight:500}
.wbox:not(.wide) .wfoot{border:0;justify-content:flex-end;padding-top:0}.wbox:not(.wide) .wfoot button{flex:none;padding:0 18px}

// ── 서버 저장 (Argus 계정·멤버 공유)
let SB=null,SNAP={sp:{},it:{}},pushT=null,pushing=false,again=false,lastPull=0;
const myRole=sid=>{const sp=S.spaces.find(s=>s.id===sid);return sp?(sp.role||'소유자'):null};
const canEdit=sid=>SB?['소유자','편집자'].includes(myRole(sid)):true;
const spSig=s=>JSON.stringify([s.name,s.desc||'']);
function queuePush(){clearTimeout(pushT);pushT=setTimeout(push,350)}
async function push(){
  if(!SB)return;if(pushing){again=true;return}pushing=true;let bad=null;
  try{
    for(const sp of S.spaces){const j=spSig(sp);if(SNAP.sp[sp.id]===j||!canEdit(sp.id))continue;
      const r=SNAP.sp[sp.id]===undefined?await SB.from('ws_spaces').insert({id:sp.id,name:sp.name,descr:sp.desc||''}):await SB.from('ws_spaces').update({name:sp.name,descr:sp.desc||'',updated_at:now()}).eq('id',sp.id);
      if(r.error)bad=r.error;else{if(SNAP.sp[sp.id]===undefined){sp.role='소유자';sp.owner=ME;sp.members=[{name:ME,role:'소유자',uid:MYID}]}SNAP.sp[sp.id]=j}}
    for(const id of Object.keys(SNAP.sp))if(!S.spaces.some(s=>s.id===id)){const r=await SB.from('ws_spaces').delete().eq('id',id);if(r.error)bad=r.error;else delete SNAP.sp[id]}
    if(S.items.some(i=>SNAP.it[i.id]!==JSON.stringify(i)&&!canEdit(i.space)))bad={message:'보기 권한만 있는 워크스페이스라 수정할 수 없습니다'};
    const up=S.items.filter(i=>SNAP.it[i.id]!==JSON.stringify(i)&&canEdit(i.space)&&SNAP.sp[i.space]!==undefined);
    if(up.length){const r=await SB.from('ws_items').upsert(up.map(i=>({id:i.id,space_id:i.space,data:i,updated_at:now()})));if(r.error)bad=r.error;else up.forEach(i=>SNAP.it[i.id]=JSON.stringify(i))}
    const gone=Object.keys(SNAP.it).filter(id=>!S.items.some(i=>i.id===id));
    if(gone.length){const r=await SB.from('ws_items').delete().in('id',gone);if(r.error)bad=r.error;else gone.forEach(id=>delete SNAP.it[id])}
    const lg=S.log.filter(l=>!l._s&&SNAP.sp[l.space]!==undefined);
    if(lg.length){const r=await SB.from('ws_log').insert(lg.map(l=>({space_id:l.space,at:l.at,by_name:l.by,text:l.text})));if(!r.error)lg.forEach(l=>l._s=1)}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  }catch(e){bad=e}
  pushing=false;if(bad){toast('서버에 저장하지 못했습니다 — '+esc(bad.message||bad)+' · 서버 내용으로 다시 불러옵니다',4200);pull(true)}
  if(again){again=false;push()}
}
async function pull(force){
  if(!SB||pushing)return;if(!force&&($('#wdlg.open')||$('.wmenu')))return;
  const [a,b,c,d]=await Promise.all([SB.from('ws_spaces').select('*').order('created_at'),SB.from('ws_members').select('*').order('added_at'),SB.from('ws_items').select('id,space_id,data'),SB.from('ws_log').select('*').order('at',{ascending:false}).limit(500)]);
  const e=a.error||b.error||c.error||d.error;if(e)throw e;
  const mem={};b.data.forEach(m=>(mem[m.space_id]=mem[m.space_id]||[]).push({name:m.name||m.email,role:m.role,email:m.email,uid:m.user_id}));
  const spaces=a.data.map(r=>{const ms=mem[r.id]||[];const me=ms.find(m=>m.uid===MYID);const ow=ms.find(m=>m.role==='소유자');
    return {id:r.id,name:r.name,desc:r.descr||'',owner:ow?ow.name:'',members:ms,created:r.created_at,role:me?me.role:(r.owner_id===MYID?'소유자':'뷰어')}});
  const items=c.data.map(r=>Object.assign({comments:[],owners:[],links:[],meta:{},custom:{}},r.data,{id:r.id,space:r.space_id}));
  const logs=d.data.map(r=>({at:r.at,space:r.space_id,by:r.by_name||'',text:r.text||'',_s:1}));
  SNAP={sp:Object.fromEntries(spaces.map(s=>[s.id,spSig(s)])),it:Object.fromEntries(items.map(i=>[i.id,JSON.stringify(i)]))};
  const cur=S.cur;S={v:2,spaces,joined:[],cur:spaces.some(s=>s.id===cur)?cur:(spaces[0]||{}).id,items,log:logs};lastPull=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
  return spaces.length;
}
async function migrate(local){
  // 처음 한 번: 이 브라우저에만 있던 워크스페이스·물건·활동기록을 내 계정으로 옮긴다 ('나' → 내 이름)
  const fix=v=>v==='나'?ME:v;
  local.spaces.forEach(sp=>{sp.owner=ME;sp.members=[{name:ME,role:'소유자',uid:MYID}];sp.role='소유자'});
  local.items.forEach(i=>{i.owners=(i.owners||[]).map(fix);(i.comments||[]).forEach(c=>c.by=fix(c.by))});
  local.log.forEach(l=>{l.by=fix(l.by);delete l._s});
  S=local;SNAP={sp:{},it:{}};await push();
}

function sanitize(html){const t=document.createElement('template');t.innerHTML=html;const OK=new Set(['B','STRONG','I','EM','U','S','STRIKE','DEL','CODE','PRE','BLOCKQUOTE','UL','OL','LI','H3','H4','P','BR','DIV','A','SUP','SUB','MARK','SPAN']);
  (function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===1){if(!OK.has(c.tagName)){c.replaceWith(...c.childNodes);return walk(n)}[...c.attributes].forEach(a=>{const keep=(c.tagName==='A'&&a.name==='href'&&/^https?:/i.test(a.value))||(a.name==='style'&&/^text-align:\s*(left|center|right|justify);?$/.test(a.value));if(!keep)c.removeAttribute(a.name)});if(c.tagName==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}walk(c)}else if(c.nodeType!==3)c.remove()})})(t.content);return t.innerHTML}

     <ul class="mems">${sp.members.map((m,k)=>`<li><b class="av">${esc(m.name.slice(0,1))}</b><span>${esc(m.name)}${m.email?` <span class="note">${esc(m.email)}</span>`:''}</span><span class="sp"></span>${m.role==='소유자'||(SB&&sp.role!=='소유자')?`<span class="note">${m.role}</span>`:false?'':`<select data-mr="${k}"><option ${m.role==='편집자'?'selected':''}>편집자</option><option ${m.role==='뷰어'?'selected':''}>뷰어</option></select><button class="cdel" data-md="${k}" title="내보내기">×</button>`}</li>`).join('')}</ul>`

  const draw=()=>{dlg(body(),tab==='general'?'저장':null,()=>{const n=$('#d_n').value.trim();if(!n)return false;sp.name=n;sp.desc=$('#d_d').value.trim();log('워크스페이스 정보 수정');save();render()},()=>{
    $('#wdlg .seg2').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;draw()};
    const ad=$('#d_add');if(ad){const go=async()=>{const n=$('#d_m').value.trim();if(!n)return;if(sp.members.some(m=>m.name===n||m.email===n)){toast('이미 멤버입니다');return}
      if(SB){if(sp.role!=='소유자'){toast('워크스페이스 소유자만 초대할 수 있습니다');return}ad.disabled=true;const r=await SB.rpc('ws_invite',{sp:sp.id,mail:n,r:$('#d_r').value});ad.disabled=false;
        if(r.error){toast(esc(r.error.message));return}const m=r.data;sp.members.push({name:m.name||m.email,role:m.role,email:m.email,uid:m.user_id});log(`멤버 ${m.name||m.email} 초대`);save();render();draw();toast(`${esc(m.name||m.email)}님을 초대했습니다`);return}
      sp.members.push({name:n,role:$('#d_r').value});log(`멤버 ${n} 초대`);save();render();draw()};ad.onclick=go;$('#d_m').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};$('#d_m').focus()}
    $$('[data-mr]').forEach(s=>s.onchange=async()=>{const m=sp.members[+s.dataset.mr];if(SB&&m.uid){const r=await SB.from('ws_members').update({role:s.value}).eq('space_id',sp.id).eq('user_id',m.uid);if(r.error){toast(esc(r.error.message));draw();return}}m.role=s.value;log(`멤버 ${m.name} 권한 ${s.value}`);save()});
    $$('[data-md]').forEach(b=>b.onclick=async()=>{const m=sp.members[+b.dataset.md];if(SB&&m.uid){const r=await SB.from('ws_members').delete().eq('space_id',sp.id).eq('user_id',m.uid);if(r.error){toast(esc(r.error.message));return}}sp.members.splice(+b.dataset.md,1);items().forEach(i=>i.owners=i.owners.filter(o=>o!==m.name));log(`멤버 ${m.name} 내보냄`);save();render();draw()});
    const dd=$('#d_del');if(dd)dd.onclick=()=>{if($('#d_c').value.trim()!==sp.name){$('#d_c').closest('.fld').classList.add('bad');return}S.items=S.items.filter(i=>i.space!==sp.id);S.spaces=S.spaces.filter(s=>s.id!==sp.id);S.cur=S.spaces[0].id;S.log=S.log.filter(l=>l.space!==sp.id);save();closeDlg();history.replaceState(null,'',`#space=${S.cur}`);render();toast('워크스페이스를 삭제했습니다')};

// ── 매물 추가 (빠른 / 상세)
$('#wsadd').onclick=()=>addForm();
function addForm(){

  const body=()=>`<h3>매물 추가</h3><div class="seg2"><button data-m="quick" class="${mode==='quick'?'on':''}">빠른 추가</button><button data-m="full" class="${mode==='full'?'on':''}">상세 추가</button></div>
   <div class="wscroll"><label class="fld">매물명 <i>*</i><input id="a_t" placeholder="예: 강남구 역삼동 복합개발"></label>
   <label class="fld">위치 <i>*</i><input id="a_l" placeholder="예: 서울시 강남구 역삼1동"></label>
   <div class="two"><label class="fld">대지 면적<span class="unit"><input id="a_la" inputmode="decimal" placeholder="예: 330.58"><em>㎡</em></span></label><label class="fld">건물 면적<span class="unit"><input id="a_ba" inputmode="decimal" placeholder="예: 198.34"><em>㎡</em></span></label></div>
   <label class="fld">금액 <i>*</i><span class="unit"><input id="a_a" inputmode="numeric" placeholder="예: 15,000,000,000"><em>원</em></span></label>
   <div class="two"><label class="fld">게시일 <i>*</i><input id="a_p" type="date"></label><label class="fld">종료일 <i>*</i><input id="a_e" type="date"></label></div>
   ${mode==='full'?`<div class="two"><label class="fld">시작일<input id="a_s" type="date"></label><label class="fld">마감일<input id="a_d" type="date"></label></div>
   <div class="two"><label class="fld">상태<select id="a_st">${ST.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label><label class="fld">우선순위<select id="a_pr">${PR.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select></label></div>
   <div class="fld">담당자 <span class="note">(${owners.length}/3)</span><div class="ownpick">${sp.members.map(m=>`<button data-o="${esc(m.name)}" class="${owners.includes(m.name)?'on':''}"><b class="av sm">${esc(m.name.slice(0,1))}</b>${esc(m.name)}</button>`).join('')}</div></div>
   <label class="fld">본문(설명)<textarea id="a_b" rows="3" placeholder="매물에 대한 설명을 입력하세요..."></textarea></label>
   <hr class="sep"><div class="fld"><b>커스텀 필드</b><div id="a_cf">${Object.keys(custom).map(k=>`<label class="cfrow"><span>${esc(k)}</span><input data-cf="${esc(k)}" value="${esc(custom[k])}"><button class="cdel" data-cfdel="${esc(k)}">×</button></label>`).join('')}</div>
   <div class="cfadd"><button data-cfnew="1">＋ 필드 추가 (${Object.keys(custom).length}/10)</button></div><div class="cfchips">${CUSTOM.filter(k=>!(k in custom)).map(k=>`<button data-cfadd="${k}">+ ${k}</button>`).join('')}</div></div>`:''}</div>`;
  const keep=()=>{const v={};$$('#wdlg input[id],#wdlg textarea[id],#wdlg select[id]').forEach(e=>v[e.id]=e.value);$$('#wdlg [data-cf]').forEach(e=>custom[e.dataset.cf]=e.value);return v};
  const restore=v=>Object.entries(v).forEach(([k,x])=>{const e=document.getElementById(k);if(e)e.value=x});
  const ok=()=>{const v=keep();const need=['a_t','a_l','a_a','a_p','a_e'];const miss=need.filter(k=>!String(v[k]||'').trim());
    $$('#wdlg .fld').forEach(f=>f.classList.remove('bad'));if(miss.length){miss.forEach(k=>document.getElementById(k).closest('.fld').classList.add('bad'));return false}
    if(v.a_e<v.a_p){$('#a_e').closest('.fld').classList.add('bad');toast('종료일이 게시일보다 빠릅니다');return false}
    const it=blank({title:v.a_t.trim(),loc:v.a_l.trim(),land:+v.a_la||null,bldg:+v.a_ba||null,amount:+String(v.a_a).replace(/[^\d]/g,'')||null,posted:v.a_p,end:v.a_e});
    if(mode==='full')Object.assign(it,{start:v.a_s||'',due:v.a_d||'',status:v.a_st,priority:v.a_pr,owners:[...owners],body:v.a_b?`<p>${esc(v.a_b).replace(/\n/g,'<br>')}</p>`:'',custom:Object.fromEntries(Object.entries(custom).filter(([k])=>k.trim()))});
    S.items.push(it);log(`「${it.title}」 직접 등록`);save();render()};
  const draw=v=>{dlg(body(),'추가',ok,null,'wide');v&&restore(v);
    const okb=$('#wdlg .wok');const chk=()=>okb.disabled=!['a_t','a_l','a_a','a_p','a_e'].every(k=>($('#'+k).value||'').trim());chk();$$('#wdlg input,#wdlg textarea').forEach(e=>e.addEventListener('input',chk));
    $('#wdlg .seg2').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=keep();mode=b.dataset.m;draw(v)};
    $$('#wdlg [data-cfadd]').forEach(b=>b.onclick=()=>{const v=keep();if(Object.keys(custom).length<10)custom[b.dataset.cfadd]='';else toast('커스텀 필드는 10개까지입니다');draw(v)});
    $$('#wdlg [data-cfdel]').forEach(b=>b.onclick=()=>{const v=keep();delete custom[b.dataset.cfdel];draw(v)});
    const nb=$('#wdlg [data-cfnew]');if(nb)nb.onclick=()=>{const v=keep();if(Object.keys(custom).length>=10){toast('커스텀 필드는 10개까지입니다');return}const n=prompt('필드 이름');if(n&&n.trim()&&!(n.trim() in custom))custom[n.trim()]='';draw(v)};
    $$('#wdlg [data-o]').forEach(b=>b.onclick=()=>{const v=keep();const n=b.dataset.o;owners=owners.includes(n)?owners.filter(o=>o!==n):owners.length<3?[...owners,n]:owners;draw(v)});
    const a=$('#a_a');a.oninput=()=>{const n=a.value.replace(/[^\d]/g,'');a.value=n?(+n).toLocaleString():'';chk()};$('#a_t').focus()};
  draw();
}

// ── 작업 상세
let csort=1,editing=null;
function detail(id){
  const i=S.items.find(x=>x.id===id);if(!i)return;
  history.replaceState(null,'',`#space=${i.space}&item=${id}`);
  const rep=i.kind==='report',m=i.meta||{};

  const info=rep?[]:[[ '공고기관',`${esc(i.org||'–')}${i.links[0]?` <a class="ext" href="${esc(i.links[0].u)}" target="_blank" rel="noopener" title="${esc(i.links[0].t)}">${I_.ext}</a>`:''}`],['위　　치',`${esc(i.loc||'–')}${mapLinks(i.loc)}`],['게 시 일',i.posted||'–'],['종 료 일',i.end?`${i.end} 마감`:'–'],['금　　액',won(i.amount)?`<b class="num">${won(i.amount)}</b>`:'<span class="note">금액 미정</span>'],
    ...(i.land||i.bldg?[['면　　적',[i.land?`대지 ${(+i.land).toLocaleString()}㎡`:'',i.bldg?`건물 ${(+i.bldg).toLocaleString()}㎡`:''].filter(Boolean).join(' · ')]]:[])];
  const metaRows=Object.entries(m).map(([k,v])=>[k,fmtMeta(k,v)]).filter(r=>r[1]!=null);
  const cs=i.comments.slice().sort((a,b)=>(a.at>b.at?1:-1)*csort);
  const prop=(ic,label,val,attr)=>`<button class="tprop" ${attr}>${ic}<span>${val||`<span class="note">${label}</span>`}</span></button>`;
  dlg(`<div class="th" data-id="${i.id}"><span class="btag ${TAGC[i.board]||'r'}">${esc(i.board)}</span><button class="tmenu" id="t_menu" aria-label="더보기">⋯</button><h2 contenteditable="true" spellcheck="false" id="t_title">${esc(i.title)}</h2>
    <div class="tprops">${prop(`<span class="sic" style="color:${STN[i.status][2]}">${I_[i.status]}</span>`,'상태',STN[i.status][1],'id="t_st"')}${prop(`<span class="sic" style="color:${PRN[i.priority][2]}">${I_[i.priority]}</span>`,'우선순위',PRN[i.priority][1],'id="t_pr"')}${prop(`<span class="sic">${I_.user}</span>`,'담당자',i.owners.join(', '),'id="t_ow"')}
     <label class="tprop">${I_.cal}<span class="note dl">시작일</span><input type="date" id="t_s" value="${i.start}"></label><label class="tprop">${I_.cal}<span class="note dl">마감일</span><input type="date" id="t_d" value="${i.due}"></label></div></div>
   <div class="tbody"><div class="tl">
    ${info.length?`<dl class="mi">${info.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:''}
    ${metaRows.length?`<dl class="mi ${info.length?'sub':''}">${metaRows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`:''}
    ${i.kind==='listing'?`<a class="golist" href="listings.html#${encodeURIComponent(i.ref)}">매물·공고에서 최신 정보 보기 ↗</a>`:''}
    <section class="tsec"><h5>본문 내용 <span class="note" title="공고 원문 요약과 검토 메모를 자유롭게 고칠 수 있습니다">ⓘ</span><span class="sp"></span><button class="fold">⌃</button></h5><div class="rte"><div class="rtb">${TB}</div><div class="rbody" id="t_b" contenteditable="true" data-ph="검토 메모, 공고 요약 등을 적어 두세요.">${sanitize(i.body)}</div></div></section>
    ${i.links.length?`<section class="tsec"><h5>첨부 문서 <span class="note">ⓘ</span><span class="sp"></span><button class="fold">⌃</button></h5><div>${i.links.map(l=>`<div class="att"><span>📎 ${esc(linkLabel(i,l))}</span><a href="${esc(l.u)}" target="_blank" rel="noopener">바로 가기</a></div>`).join('')}</div></section>`:''}
    <section class="tsec"><h5>커스텀 필드 <span class="note">${Object.keys(i.custom).length}/10</span><span class="sp"></span><button class="fold">⌃</button></h5><div>${Object.entries(i.custom).map(([k,v])=>`<label class="cfrow"><span>${esc(k)}</span><input data-tcf="${esc(k)}" value="${esc(v)}"><button class="cdel" data-tcfd="${esc(k)}">×</button></label>`).join('')}<div class="cfchips">${CUSTOM.filter(k=>!(k in i.custom)).map(k=>`<button data-tcfa="${k}">+ ${k}</button>`).join('')}</div></div></section>
    <div class="note" style="margin:14px 0 4px">등록 ${fmtAt(i.created)} · ${esc(i.by)} · 최근 수정 ${ago(i.updated)}</div></div>
   <div class="tr"><div class="trh"><b>코멘트</b><span class="kc num">${i.comments.length}</span><span class="sp"></span><button id="t_sort" class="note">${csort>0?'과거순 ↑':'최신순 ↓'}</button></div>
    <div class="clist2" id="t_cl">${cs.map(c=>`<div class="cm" data-c="${c.at}"><div class="cmh"><b class="av sm">${esc(c.by.slice(0,1))}</b><b>${esc(c.by)}</b><span class="note num">${fmtAt(c.at)}${c.ed?' · 수정됨':''}</span><span class="sp"></span>${c.by===ME?`<button class="cact" data-ce="${c.at}">수정</button><button class="cact" data-cd="${c.at}">삭제</button>`:''}</div><div class="cmb">${editing===c.at?`<div class="rte sm"><div class="rtb">${TB}</div><div class="rbody" id="t_ce" contenteditable="true">${sanitize(c.h)}</div></div><div class="ceb"><button data-cx="1">취소</button><button data-cs="${c.at}" class="pri">저장</button></div>`:sanitize(c.h)}</div></div>`).join('')||`<div class="cempty">${I_.chat}<div>아직 코멘트가 없습니다</div><small class="note">왜 보류했는지, 무엇을 더 봐야 하는지 남겨 두세요.<br>멤버를 @이름 으로 부를 수 있습니다.</small></div>`}</div>
    <div class="cin"><div class="rte"><div class="rbody" id="t_c" contenteditable="true" data-ph="코멘트를 입력하세요..."></div><div class="rtb bot">${TB}<span class="sp"></span><button id="t_send" class="send" title="등록 (Ctrl+Enter)">➤</button></div></div></div></div></div>`,null,null,()=>{
    const box=$('#wdlg .wbox');box.classList.add('task');box.dataset.id=id;
    const sv=(p,msg)=>{Object.assign(i,p);i.updated=now();if(msg)log(msg);save();render()};
    $('#t_st').onclick=e=>{e.stopPropagation();choose(e.currentTarget,ST.map(x=>[x[0],x[1],I_[x[0]],x[2]]),v=>setStatus(id,v))};
    $('#t_pr').onclick=e=>{e.stopPropagation();choose(e.currentTarget,PR.map(x=>[x[0],x[1],I_[x[0]],x[2]]),v=>upd(id,{priority:v},i=>`「${i.title}」 우선순위 ${PRN[v][1]}`))};
    $('#t_ow').onclick=e=>{e.stopPropagation();ownerMenu(e.currentTarget,id)};
    $('#t_s').onchange=e=>{if(i.due&&e.target.value>i.due){toast('시작일이 마감일보다 늦습니다');e.target.value=i.start;return}sv({start:e.target.value},`「${i.title}」 시작일 ${e.target.value||'삭제'}`);detail(id)};
    $('#t_d').onchange=e=>{if(i.start&&e.target.value&&e.target.value<i.start){toast('마감일이 시작일보다 빠릅니다');e.target.value=i.due;return}sv({due:e.target.value},`「${i.title}」 마감일 ${e.target.value||'삭제'}`);detail(id)};
    $('#t_title').onblur=e=>{const t=e.target.textContent.trim();if(t&&t!==i.title)sv({title:t},`제목 변경 → 「${t}」`);else e.target.textContent=i.title};
    $('#t_title').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}};
    $('#t_b').onblur=e=>{const h=sanitize(e.target.innerHTML);if(h!==i.body)sv({body:h})};
    $('#t_menu').onclick=e=>{e.stopPropagation();cardMenu(e.currentTarget,id)};
    $$('#wdlg .fold').forEach(b=>b.onclick=()=>b.closest('.tsec').classList.toggle('closed'));
    $$('[data-tcf]').forEach(el=>el.onchange=()=>sv({custom:{...i.custom,[el.dataset.tcf]:el.value}}));
    $$('[data-tcfd]').forEach(b=>b.onclick=()=>{const c={...i.custom};delete c[b.dataset.tcfd];sv({custom:c});detail(id)});
    $$('[data-tcfa]').forEach(b=>b.onclick=()=>{if(Object.keys(i.custom).length>=10){toast('커스텀 필드는 10개까지입니다');return}sv({custom:{...i.custom,[b.dataset.tcfa]:''}});detail(id);const el=$(`[data-tcf="${b.dataset.tcfa}"]`);el&&el.focus()});
    $('#t_sort').onclick=()=>{csort=-csort;detail(id)};
    wireRte($('#wdlg'));
    const send=()=>{const el=$('#t_c');const h=sanitize(el.innerHTML).replace(/@([가-힣A-Za-z0-9_.-]+)/g,'<mark>@$1</mark>');if(!el.textContent.trim())return;i.comments.push({at:now(),by:ME,h});sv({},`「${i.title}」 코멘트`);editing=null;detail(id);const l=$('#t_cl');l.scrollTop=csort>0?1e6:0};

      box.querySelector('[data-y]').onclick=ev=>{ev.stopPropagation();i.comments=i.comments.filter(c=>c.at!==at);sv({},'코멘트 삭제');detail(id);toast('코멘트를 삭제했습니다')}});
    $$('[data-ce]').forEach(b=>b.onclick=()=>{editing=b.dataset.ce;detail(id);const el=$('#t_ce');el&&el.focus()});
    const cx=$('[data-cx]');if(cx)cx.onclick=()=>{editing=null;detail(id)};
    const cs2=$('[data-cs]');if(cs2)cs2.onclick=()=>{const c=i.comments.find(c=>c.at===cs2.dataset.cs);c.h=sanitize($('#t_ce').innerHTML);c.ed=1;editing=null;sv({});detail(id)};
  },'task');
}

const TB=[['formatBlock:H3','H','제목'],['insertUnorderedList','•≡','글머리 목록'],['insertOrderedList','1.','번호 목록'],['formatBlock:BLOCKQUOTE','❝','인용'],['formatBlock:PRE','&lt;/&gt;','코드 블록'],['|'],['bold','<b>B</b>','굵게'],['italic','<i>I</i>','기울임'],['strikeThrough','<s>S</s>','취소선'],['code','<code>‹›</code>','인라인 코드'],['underline','<u>U</u>','밑줄'],['hilite','<mark>H</mark>','강조'],['createLink','🔗','링크'],['superscript','x²','위 첨자'],['subscript','x₂','아래 첨자'],['|'],['justifyLeft','⫷','왼쪽 정렬'],['justifyCenter','≡','가운데 정렬'],['justifyRight','⫸','오른쪽 정렬'],['justifyFull','☰','양쪽 정렬']].map(b=>b[0]==='|'?'<i class="rsep"></i>':`<button type="button" data-cmd="${b[0]}" title="${b[2]}">${b[1]}</button>`).join('');
function wireRte(root){root.querySelectorAll('.rtb').forEach(bar=>{bar.addEventListener('mousedown',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;e.preventDefault();
  const ed=bar.parentElement.querySelector('.rbody');ed.focus();const [c,arg]=b.dataset.cmd.split(':');
  if(c==='createLink'){const u=prompt('링크 주소 (https://...)');if(u&&/^https?:\/\//.test(u))document.execCommand('createLink',false,u);return}
  if(c==='code'||c==='hilite'){const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return;const r=sel.getRangeAt(0);const el=document.createElement(c==='code'?'code':'mark');try{r.surroundContents(el)}catch(_){}return}
  if(c==='formatBlock'){const cur=document.queryCommandValue('formatBlock').toUpperCase();document.execCommand('formatBlock',false,cur===arg?'P':arg);return}
  document.execCommand(c,false,null)})})}

<script>
const CATS=[['office','오피스'],['residential','주거'],['retail','리테일'],['logistics','물류·산업'],['hotel','호텔'],['datacenter','데이터센터'],['capital','투자·금융'],['outlook','시장전망'],['etc','기타']];
const SUBORDER={'오피스':['분기 마켓리포트','권역 분석','투자·거래','임차·수요','공급·개발'],'물류·산업':['마켓리포트','산업·지산','투자·거래','콜드체인'],'리테일':['마켓리포트','상권 분석','트렌드'],'호텔':['호텔 시장','숙박 동향','호텔 투자','관광·인바운드'],'데이터센터':['마켓리포트','투자·개발','전력·인프라'],'주거':['지표·시장','임대·리빙','정책·공급','기타'],'투자·금융':['투자자 동향','거래 리뷰','리츠·자본시장','투자 리포트'],'시장전망':['연간 전망','분기 지표','시장 리포트'],'기타':['정책·도시계획','기타']};
const TODAY=new Date();
let D=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isWk=x=>x.dk==='d'&&(TODAY-new Date(x.d+'T12:00:00+09:00'))/864e5<7;
const fd=x=>x.dk==='d'?x.d.replace(/-/g,'.'):x.dk==='m'?x.d.replace('-','.'):x.dk==='q'?x.d.replace('-','.'):x.dk==='y'?x.d:'—';
const yr=x=>x.d?x.d.slice(0,4):'미상';
const LT=x=>x.lt==='원문'?'<span class="src o">원문</span>':x.lt==='블로그'?'<span class="src b">블로그</span>':x.lt==='발행처'?'<span class="src p" title="원문 PDF 대신 발행처의 같은 시리즈 보고서 페이지로 연결됩니다">발행처</span>':'<span class="src n">링크 없음</span>';
const LTN=x=>x.lt||'링크 없음';
const tlink=(x,cls)=>x.u?`<a class="${cls||''}" href="${esc(x.u)}" target="_blank" rel="noopener" title="${esc(x.t)}">${esc(x.t)}</a>`:`<span class="${cls||''}" title="${esc(x.t)}">${esc(x.t)}</span>`;
const V=document.getElementById('view');
const LEG=`<div class="legend"><span><span class="src o">원문</span> 발행처 원문</span><span><span class="src b">블로그</span> 블로그 경유</span><span><span class="src p">발행처</span> 발행처 보고서 페이지</span><span><span class="src n">링크 없음</span> 개인 보관 파일</span><span><span class="wk">This Week</span> 최근 7일</span></div>`;


const RW=()=>window.ARGUS_WS;
function wsBtn(x,mini){const w=RW()?RW().inWs('R:'+(x.u||x.t)):[];return w.length?`<button class="wsadd added ${mini?'mini':''}" data-ri="${D.indexOf(x)}" title="워크스페이스에서 열기">${mini?'✓':'✓ 추가됨'}</button>`:`<button class="wsadd ${mini?'mini':''}" data-ri="${D.indexOf(x)}" title="워크스페이스에 추가">＋</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ri]');if(!b)return;e.preventDefault();e.stopPropagation();const x=D[+b.dataset.ri];const ref='R:'+(x.u||x.t);const w=RW().inWs(ref);
  if(w.length){RW().open(w[0].space,w[0].id);return}RW().pick(b,RW().fromReport(x),()=>route())},true);
document.addEventListener('ws:change',()=>route());
function home(){
  V.innerHTML=`<div class="home"><div class="hd"><h2>카테고리별 최신 자료</h2>${LEG}</div><div class="grid">${CATS.map(([slug,c])=>{const a=D.filter(x=>x.c===c);return `<div class="card"><div class="ch"><b>${c}</b><a href="#c-${slug}">전체 ${a.length.toLocaleString()}건 ›</a></div><ul>${a.slice(0,4).map(x=>`<li>${tlink(x,'tt')}${wsBtn(x,1)}<div class="meta2">${LT(x)}<span>${esc(x.h)}</span><i></i><span class="num">${fd(x)}</span>${isWk(x)?'<span class="wk">This Week</span>':''}</div></li>`).join('')}</ul></div>`}).join('')}</div></div>`;
}

const S={cat:null,sub:'',sel:{},q:'',sort:{k:'k',d:-1},page:1,per:20,more:{},closed:{}};
let FOLD=false;try{FOLD=localStorage.getItem('ar_fold')==='1'}catch(e){}
let PER=20;try{const v=+localStorage.getItem('ar_per');if(v)PER=v}catch(e){}
const FAC=[{k:'sc',t:'세부 카테고리'},{k:'c',t:'카테고리',onlyAll:1},{k:'h',t:'하우스',limit:8},{k:'p',t:'발간 주기',order:['월간','분기','반기','연간','수시']},{k:'y',t:'발행 연도',limit:6,desc:1},{k:'l',t:'언어'},{k:'lt',t:'연결',order:['원문','블로그','발행처','링크 없음']}];
const val=(x,k)=>k==='y'?yr(x):k==='lt'?LTN(x):x[k];
function base(){return D.filter(x=>S.cat==='all'||x.c===S.cat)}
function pass(x,skip){
  if(S.sub&&skip!=='sc'&&x.sc!==S.sub)return false;
  if(S.q){const h=(x.t+' '+x.h).toLowerCase();if(!h.includes(S.q))return false}
  for(const f of FAC){if(f.k===skip)continue;const s=S.sel[f.k];if(s&&s.size&&!s.has(val(x,f.k)))return false}
  return true;
}
function detail(slug){
  const cc=slug==='all'?'all':(CATS.find(c=>c[0]===slug)||[])[1];if(!cc){location.hash='';return}
  if(S.cat!==cc){S.cat=cc;S.sub='';S.sel={};S.page=1;S.more={};}
  S.per=PER;
  const name=cc==='all'?'전체 리포트':cc;
  const B=base();
  const houses=new Set(B.map(x=>x.h)).size;
  const latest=B.find(x=>x.dk==='d');
  const subs=cc==='all'?[]:(SUBORDER[cc]||[]).filter(s=>B.some(x=>x.sc===s));
  V.innerHTML=`<div class="dd"><aside class="lf" id="lf"></aside><div class="rt">
   <div class="bc"><a href="#">리서치 센터</a> › <a href="#">카테고리</a> › <b>${name}</b></div>
   <div class="dh2"><h2>${name}</h2><span class="s">리포트 ${B.length.toLocaleString()}건 · 하우스 ${houses}곳${latest?` · 최근 발간 ${fd(latest)}`:''}</span><span style="flex:1"></span>${LEG}</div>
   <div class="subs" id="subs" ${subs.length?'':'style="display:none"'}></div>
   <div class="hl" id="hl"></div>
   <div class="scroll"><table><thead><tr id="hdr"></tr></thead><tbody id="tb"></tbody></table></div>
   <div class="foot"><span class="note">제목을 누르면 발행처 원문(또는 경유 페이지)이 새 창으로 열립니다.</span><span class="sp"></span><div class="pg" id="pg"></div><div class="psel" id="psel"><button type="button"><span id="pslab"></span> ▾</button><ul></ul></div></div>
  </div></div>`;
  const psel=document.getElementById('psel');psel.querySelector('button').onclick=e=>{e.stopPropagation();psel.classList.toggle('open')};
  drawDetail();
}
function drawDetail(){
  const B=base();const cc=S.cat;
  // subs
  const subs=cc==='all'?[]:(SUBORDER[cc]||[]).filter(s=>B.some(x=>x.sc===s));
  const pre=B.filter(x=>pass(x,'sc'));
  document.getElementById('subs').innerHTML=[['',pre.length],...subs.map(s=>[s,pre.filter(x=>x.sc===s).length])].map(([s,n])=>`<button data-s="${esc(s)}" class="${S.sub===s?'on':''}">${s||'전체'}<span class="n">${n}</span></button>`).join('');
  document.querySelectorAll('#subs button').forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;S.page=1;drawDetail()});
  // facets
  const lf=document.getElementById('lf');
  const anySel=Object.values(S.sel).some(s=>s.size)||S.sub;
  let h=`<div class="reset"><div class="l"><button class="sbt ${FOLD?'':'on'}" id="fold" title="필터 패널 접기/펼치기" aria-label="필터 패널 접기/펼치기" aria-expanded="${!FOLD}"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.5"/><rect class="fill" x="4.2" y="5.7" width="4.8" height="12.6" stroke="none" fill="none"/><path d="M9.5 4.5v15"/></svg></button><span>필터</span></div><button id="rst" ${anySel?'':'style="visibility:hidden"'}>초기화</button></div>`;
  for(const f of FAC){
    if(f.onlyAll&&cc!=='all')continue;
    if(f.k==='sc'&&cc==='all')continue;
    const all=new Map();B.forEach(x=>all.set(val(x,f.k),0));
    B.forEach(x=>{if(pass(x,f.k)){const v=val(x,f.k);all.set(v,all.get(v)+1)}});
    let vals=[...all.keys()];
    if(f.k==='sc')vals.sort((a,b)=>(SUBORDER[cc]||[]).indexOf(a)-(SUBORDER[cc]||[]).indexOf(b));
    else if(f.order)vals.sort((a,b)=>f.order.indexOf(a)-f.order.indexOf(b));
    else if(f.desc)vals.sort((a,b)=>a==='미상'?1:b==='미상'?-1:b.localeCompare(a));
    else vals.sort((a,b)=>all.get(b)-all.get(a)||a.localeCompare(b,'ko'));
    const lim=f.limit&&!S.more[f.k]?f.limit:999;
    const sel=S.sel[f.k]||new Set();const isSub=f.k==='sc';
    h+=`<div class="fg ${S.closed[f.k]?'closed':''}"><h4 data-t="${f.k}">${f.t}<span>${S.closed[f.k]?'+':'−'}</span></h4><ul>${vals.slice(0,lim).map(v=>{const n=all.get(v),on=isSub?S.sub===v:sel.has(v);return `<li data-k="${f.k}" data-v="${esc(v)}" class="${on?'on':''} ${n?'':'zero'}"><span class="cb"></span><span class="nm">${esc(v)}</span><span class="ct">${n}</span></li>`}).join('')}${vals.length>lim?`<li class="more" data-m="${f.k}">+ ${vals.length-lim}개 더보기</li>`:''}</ul></div>`;
  }
  lf.innerHTML=h;
  lf.querySelectorAll('h4').forEach(x=>x.onclick=()=>{S.closed[x.dataset.t]=!S.closed[x.dataset.t];drawDetail()});
  lf.querySelectorAll('li[data-k]').forEach(li=>li.onclick=()=>{const k=li.dataset.k,v=li.dataset.v;if(k==='sc'){S.sub=S.sub===v?'':v}else{(S.sel[k]=S.sel[k]||new Set());S.sel[k].has(v)?S.sel[k].delete(v):S.sel[k].add(v)}S.page=1;drawDetail()});
  lf.querySelectorAll('[data-m]').forEach(li=>li.onclick=()=>{S.more[li.dataset.m]=1;drawDetail()});
  document.querySelector('.dd').classList.toggle('nof',FOLD);
  document.getElementById('fold').onclick=()=>{FOLD=!FOLD;try{localStorage.setItem('ar_fold',FOLD?'1':'0')}catch(e){}drawDetail()};
  const r=document.getElementById('rst');if(r)r.onclick=()=>{S.sel={};S.sub='';S.page=1;drawDetail()};
  // rows
  const rows=B.filter(x=>pass(x));
  // highlights
  const yAgo=new Date(TODAY);yAgo.setFullYear(yAgo.getFullYear()-1);
  const recent=rows.filter(x=>x.dk==='d'&&new Date(x.d)>=yAgo);
  const hc={};recent.forEach(x=>hc[x.h]=(hc[x.h]||0)+1);const topH=Object.entries(hc).sort((a,b)=>b[1]-a[1])[0];
  const mon=rows.filter(x=>x.dk==='d'&&x.d.startsWith('2026-11')).length;
  const dated=rows.filter(x=>x.d);const oldest=dated.length?dated[dated.length-1]:null,newest=rows.find(x=>x.dk==='d');
  document.getElementById('hl').innerHTML=`<div><div class="l">최근 발간</div><div class="t">${newest?esc(newest.h)+' · '+fd(newest):'—'}</div></div><div><div class="l">이번 달 발간 (2026.11)</div><div class="t">${mon}건</div></div><div><div class="l">최근 1년 최다 발간 하우스</div><div class="t">${topH?esc(topH[0])+' · '+topH[1]+'건':'—'}</div></div><div><div class="l">수록 기간</div><div class="t">${oldest?fd(oldest)+' ~ '+(newest?fd(newest):''):'—'}</div></div>`;
  // sort
  const {k,d}=S.sort;
  rows.sort((a,b)=>{const A=k==='k'?a.k:(a[k]||''),B2=k==='k'?b.k:(b[k]||'');return (A>B2?1:A<B2?-1:0)*d||b.k.localeCompare(a.k)});
  const COLS=[['k','발행일',96],['t','제목'],...(cc==='all'?[['c','카테고리',90]]:[]),['sc','세부 카테고리',130],['h','하우스',150],['p','주기',56],['l','언어',56],['lt','연결',84],['ws','워크스페이스',88]];
  document.getElementById('hdr').innerHTML=COLS.map(([kk,t,w])=>`<th data-k="${kk}" ${w?`style="width:${w}px"`:''}>${t}${S.sort.k===kk?`<span class="ar">${S.sort.d>0?'↑':'↓'}</span>`:''}</th>`).join('');
  document.querySelectorAll('#hdr th').forEach(th=>th.onclick=()=>{const kk=th.dataset.k;if(kk==='ws')return;S.sort=S.sort.k===kk?{k:kk,d:-S.sort.d}:{k:kk,d:kk==='k'?-1:1};drawDetail()});
  const pages=Math.max(1,Math.ceil(rows.length/S.per));if(S.page>pages)S.page=pages;
  const view=rows.slice((S.page-1)*S.per,S.page*S.per);
  document.getElementById('tb').innerHTML=view.map(x=>`<tr><td class="num m">${fd(x)}</td><td class="t">${tlink(x)} ${isWk(x)?'<span class="wk">This Week</span>':''}</td>${cc==='all'?`<td class="m">${esc(x.c)}</td>`:''}<td><span class="sc">${esc(x.sc)}</span></td><td class="m">${esc(x.h)}</td><td class="m">${x.p}</td><td class="m">${x.l}</td><td>${LT(x)}</td><td class="wa">${wsBtn(x)}</td></tr>`).join('')||`<tr><td colspan="${COLS.length}" class="empty">조건에 맞는 리포트가 없습니다</td></tr>`;
  // pager
  let p=`<button ${S.page<=1?'disabled':''} data-p="${S.page-1}">‹</button>`,gap=false;
  for(let i=1;i<=pages;i++){if(pages>7&&Math.abs(i-S.page)>1&&i!==1&&i!==pages){if(!gap){p+='<span class="gap">…</span>';gap=true}continue}gap=false;p+=`<button data-p="${i}" class="${i===S.page?'on':''}">${i}</button>`}
  p+=`<button ${S.page>=pages?'disabled':''} data-p="${S.page+1}">›</button>`;
  const pg=document.getElementById('pg');pg.innerHTML=p;pg.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{S.page=+b.dataset.p;drawDetail();document.querySelector('.scroll').scrollTop=0});
  const psel=document.getElementById('psel');document.getElementById('pslab').textContent=S.per+'개씩';
  psel.querySelector('ul').innerHTML=[10,20,30,50,100].map(n=>`<li data-n="${n}" class="${n===S.per?'on':''}">${n}개씩</li>`).join('');
  psel.querySelectorAll('li').forEach(li=>li.onclick=()=>{PER=S.per=+li.dataset.n;try{localStorage.setItem('ar_per',PER)}catch(e){}S.page=1;psel.classList.remove('open');drawDetail()});
}
document.addEventListener('click',e=>{const p=document.getElementById('psel');if(p&&!p.contains(e.target))p.classList.remove('open')});
const qi=document.getElementById('q');
qi.oninput=()=>{S.q=qi.value.trim().toLowerCase();S.page=1;const h=location.hash;if(h==='#f'){feed();return}if(h==='#h'||h.startsWith('#h-')){houses(decodeURIComponent(h.slice(3)));return}if(!h.startsWith('#c-')){if(S.q){location.hash='c-all'}}else drawDetail()};
function route(){const h=location.hash.slice(1);const v=h==='news'?'news':h==='h'||h.startsWith('h-')?'h':h==='f'?'f':h==='cov'?'cov':h==='ms'?'ms':'cat';
  document.querySelectorAll('.ph .tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(v==='news')news();else if(v==='h')houses(decodeURIComponent(h.slice(2)));else if(v==='f')feed();else if(v==='cov')coverage();else if(v==='ms')sounding();
  else if(h.startsWith('c-'))detail(h.slice(2));else{S.cat=null;home()}}
const SLUG=Object.fromEntries(CATS.map(([a,b])=>[b,a]));
const ago=x=>x.dk==='d'?(TODAY-new Date(x.d+'T12:00:00+09:00'))/864e5:1e9;
const rrow=x=>`<li class="rxr">${tlink(x,'tt')}<div class="meta2">${LT(x)}<span class="rxc">${esc(x.c)}${x.sc?' · '+esc(x.sc):''}</span><i></i><span>${esc(x.p||'')}</span><i></i><span>${esc(x.l||'')}</span>${isWk(x)?'<span class="wk">This Week</span>':''}</div>${typeof wsBtn==='function'?wsBtn(x,1):''}</li>`;
// ── 하우스별
function houses(sel){
  const by={};D.forEach(x=>(by[x.h]=by[x.h]||[]).push(x));
  const hs=Object.entries(by).map(([h,a])=>({h,a,last:a.reduce((m,x)=>x.k>m?x.k:m,'')})).sort((a,b)=>b.a.length-a.a.length);
  const cur=hs.find(o=>o.h===sel)||hs[0];if(!cur){V.innerHTML='<div class="empty">리포트가 없습니다</div>';return}
  const q=S.q;const list=cur.a.filter(x=>!q||(x.t+' '+x.h).toLowerCase().includes(q));
  const years={};list.forEach(x=>(years[yr(x)]=years[yr(x)]||[]).push(x));const ys=Object.keys(years).sort().reverse();
  const cats={};cur.a.forEach(x=>cats[x.c]=(cats[x.c]||0)+1);
  V.innerHTML=`<div class="rxh"><aside class="rxl"><div class="rxlh">하우스 <span>${hs.length}곳</span></div>${hs.map(o=>`<a href="#h-${encodeURIComponent(o.h)}" class="${o===cur?'on':''}"><b>${esc(o.h)}</b><span class="n num">${o.a.length}</span><span class="d num">최근 ${esc(o.last.slice(0,7).replace('-','.'))}</span></a>`).join('')}</aside>
  <section class="rxm"><div class="rxmh"><h2>${esc(cur.h)}</h2><span class="note">리포트 ${cur.a.length.toLocaleString()}건 · 최근 발간 ${esc(cur.last.slice(0,10).replace(/-/g,'.'))}</span><div class="rxchips">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span>${esc(c)} <b class="num">${n}</b></span>`).join('')}</div></div>
  ${ys.map(y=>`<div class="rxy"><h4>${esc(y)} <span>${years[y].length}건</span></h4><ul>${years[y].sort((a,b)=>b.k.localeCompare(a.k)).map(x=>`<li class="rxr"><span class="rxd num">${fd(x)}</span><div class="rxb">${tlink(x,'tt')}<div class="meta2">${LT(x)}<span class="rxc">${esc(x.c)}${x.sc?' · '+esc(x.sc):''}</span><i></i><span>${esc(x.p||'')}</span><i></i><span>${esc(x.l||'')}</span>${isWk(x)?'<span class="wk">This Week</span>':''}</div></div>${typeof wsBtn==='function'?wsBtn(x,1):''}</li>`).join('')}</ul></div>`).join('')||'<div class="empty">검색 결과가 없습니다</div>'}</section></div>`;
}
// ── 발간 피드
const FS={span:30,cat:''};
function feed(){
  const q=S.q;const pool=D.filter(x=>(!FS.cat||x.c===FS.cat)&&(!q||(x.t+' '+x.h).toLowerCase().includes(q)));
  const dated=pool.filter(x=>x.dk==='d'&&(!FS.span||ago(x)<FS.span)).sort((a,b)=>b.d.localeCompare(a.d));
  const undated=FS.span?pool.filter(x=>x.dk!=='d'&&x.k>=new Date(TODAY-FS.span*864e5).toISOString().slice(0,10)).sort((a,b)=>b.k.localeCompare(a.k)):[];
  const by={};dated.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));const WD='일월화수목금토';
  const cc={};D.filter(x=>x.dk==='d'&&(!FS.span||ago(x)<FS.span)).forEach(x=>cc[x.c]=(cc[x.c]||0)+1);
  V.innerHTML=`<div class="rxf"><div class="rxfh"><div class="rxseg">${[[7,'이번 주'],[30,'최근 30일'],[90,'3개월'],[365,'1년'],[0,'전체']].map(([v,t])=>`<button data-s="${v}" class="${FS.span===v?'on':''}">${t}</button>`).join('')}</div>
    <div class="rxcat"><button data-c="" class="${!FS.cat?'on':''}">전체</button>${CATS.map(([,c])=>`<button data-c="${c}" class="${FS.cat===c?'on':''}">${c}${cc[c]?` <span class="num">${cc[c]}</span>`:''}</button>`).join('')}</div><span class="note">${dated.length.toLocaleString()}건</span></div>
    <div class="rxtl">${Object.keys(by).map(d=>`<div class="rxday"><div class="rxdl"><b class="num">${d.slice(5).replace('-','.')}</b><span>${WD[new Date(d+'T12:00:00').getDay()]}요일</span><span class="note num">${d.slice(0,4)}</span></div><ul>${by[d].map(x=>`<li class="rxr"><span class="rxhs">${esc(x.h)}</span><div class="rxb">${tlink(x,'tt')}<div class="meta2">${LT(x)}<span class="rxc">${esc(x.c)}${x.sc?' · '+esc(x.sc):''}</span><i></i><span>${esc(x.l||'')}</span></div></div>${typeof wsBtn==='function'?wsBtn(x,1):''}</li>`).join('')}</ul></div>`).join('')||'<div class="empty">이 기간에 발간된 리포트가 없습니다</div>'}
    ${undated.length?`<div class="rxday"><div class="rxdl"><b>날짜 미상</b><span class="note">월·분기만 표기</span></div><ul>${undated.map(x=>`<li class="rxr"><span class="rxhs">${esc(x.h)}</span><div class="rxb">${tlink(x,'tt')}<div class="meta2">${LT(x)}<span class="rxc">${esc(x.c)}</span><i></i><span class="num">${fd(x)}</span></div></div>${typeof wsBtn==='function'?wsBtn(x,1):''}</li>`).join('')}</ul></div>`:''}</div></div>`;
  V.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{FS.span=+b.dataset.s;feed()});V.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{FS.cat=b.dataset.c;feed()});
}
// ── 커버리지 (하우스 × 카테고리)
function coverage(){
  const hs=[...new Set(D.map(x=>x.h))].map(h=>({h,a:D.filter(x=>x.h===h)})).sort((a,b)=>b.a.length-a.a.length);
  const cs=CATS.map(c=>c[1]);const mx=Math.max(...hs.flatMap(o=>cs.map(c=>o.a.filter(x=>x.c===c).length)),1);
  const cell=(o,c)=>{const a=o.a.filter(x=>x.c===c);if(!a.length)return '<td class="z">·</td>';const last=a.reduce((m,x)=>x.k>m?x.k:m,'');const fresh=(TODAY-new Date(last+'T12:00:00'))/864e5<120;
    const al=Math.min(1,a.length/mx*1.6);return `<td data-h="${esc(o.h)}" data-c="${esc(c)}" style="background:rgba(36,99,168,${(.06+al*.6).toFixed(2)});color:${al>.55?'#fff':'#1d2733'}" data-tip="${esc(`<b>${esc(o.h)} · ${esc(c)}</b><div class="row"><span class="g">리포트</span><b class="n">${a.length}건</b></div><div class="row"><span class="g">최근 발간</span><span class="n">${last.slice(0,10)}</span></div>`+a.sort((p,q)=>q.k.localeCompare(p.k)).slice(0,3).map(x=>`<div class="g">· ${esc(x.t.slice(0,40))}</div>`).join(''))}"><b class="num">${a.length}</b><span class="num">${last.startsWith('0000')?'날짜 미상':last.slice(2,7).replace('-','.')}</span>${fresh?'<i></i>':''}</td>`};
  V.innerHTML=`<div class="rxcov"><div class="rxfh"><b>하우스 × 카테고리 커버리지</b><span class="note">숫자 = 리포트 수 · 아래 = 최근 발간(연.월) · <i class="dot"></i> 최근 4개월 안에 발간 · 칸을 누르면 목록으로 이동</span></div>
   <div class="rxcw"><table class="rxct"><thead><tr><th class="l">하우스</th>${cs.map(c=>`<th>${c}</th>`).join('')}<th>합계</th></tr></thead><tbody>${hs.map(o=>`<tr><td class="l"><a href="#h-${encodeURIComponent(o.h)}">${esc(o.h)}</a></td>${cs.map(c=>cell(o,c)).join('')}<td class="t num">${o.a.length}</td></tr>`).join('')}
   <tr class="sum"><td class="l">합계</td>${cs.map(c=>`<td class="num">${D.filter(x=>x.c===c).length}</td>`).join('')}<td class="num">${D.length}</td></tr></tbody></table></div></div>`;
  V.querySelectorAll('td[data-h]').forEach(td=>td.onclick=()=>{const c=td.dataset.c;S.cat=c;S.sub='';S.sel={h:new Set([td.dataset.h])};S.page=1;S.more={};location.hash='c-'+SLUG[c]});
}
// ── 뉴스 (매일 아침 뉴스레터 · 수집 준비 중)

    <div class="dg2"><div class="dpanel">${sk('30%',10)}${[0,1,2,3,4,5].map(()=>`<div class="drow">${sk('60%',9)}${sk('18%',9)}</div>`).join('')}</div><div class="dpanel">${sk('40%',10)}${[0,1,2,3,4,5].map(()=>`<div class="drow">${sk('22%',9)}${sk('46%',9)}${sk('16%',9)}</div>`).join('')}</div></div></div>
    <div class="dveil"><div class="dmsg"><div class="dic"><span></span><span></span><span></span></div><h2>뉴스를 준비하고 있습니다</h2>

}

    <div class="dg2"><div class="dpanel">${sk('30%',10)}<div class="dbars">${[44,62,51,70,58,76,49,83,67,72].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div><div class="dpanel">${sk('40%',10)}${[0,1,2,3,4,5].map(()=>`<div class="drow">${sk('22%',9)}${sk('46%',9)}${sk('16%',9)}</div>`).join('')}</div></div></div>
    <div class="dveil"><div class="dmsg"><div class="dic"><span></span><span></span><span></span></div><h2>마켓 사운딩을 준비하고 있습니다</h2>
    <p>하우스별 투자자 설문과 연간·분기 시장 전망을 모아<br>한눈에 비교할 수 있도록 자료를 정리하는 중입니다.</p>
    <div class="dlinks"><a href="#f">발간 피드 보기</a><a href="#c-outlook">시장전망 리포트</a><a href="#c-capital">투자·금융 리포트</a></div></div></div></div>`;

(window.ARGUS_DATA?window.ARGUS_DATA('research'):fetch('reports.json').then(r=>r.json())).then(d=>{D=d;document.getElementById('meta').textContent=`리포트 ${d.length.toLocaleString()}건 · 하우스 ${new Set(d.map(x=>x.h)).size}곳`;route()}).catch(()=>{V.innerHTML='<div class="empty">데이터를 불러오지 못했습니다</div>'});
