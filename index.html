<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Argus Research · 딜 데이터베이스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --top:#14243b; --top2:#1c3150; --rail:#ffffff;
  --bg:#eef1f5; --panel:#ffffff; --line:#dbe0e7; --line2:#e9edf2;
  --tx:#1d2733; --tx2:#5b6675; --tx3:#8b95a3;
  --ac:#2463a8; --ac-bg:#e8f0fa; --ac2:#1a4f8a;
  --b-done:#2e7d5b; --b-pref:#2a7f8f; --b-mkt:#a86a14; --b-bid:#8a5bb0; --b-wd:#b23b3b;
  --b-pf:#2463a8; --b-br:#4f6a8f; --b-ln:#5c6b7a;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 'IBM Plex Sans KR',system-ui,sans-serif;color:var(--tx);background:var(--bg);display:grid;grid-template-rows:40px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* scrollbar: thin, low-contrast */
*{scrollbar-width:thin;scrollbar-color:#cfd5dd transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d3d9e0;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#aeb7c3}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--top);color:#dfe7f1;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #0b1626}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff;letter-spacing:.2px}
.brand .logo{width:18px;height:18px}
.brand small{font-weight:400;color:#8fa3bd;margin-left:-3px}
.top .sep{width:1px;height:18px;background:#2c4263}
.top .crumb{color:#a9b9cd}
.top .crumb b{color:#fff;font-weight:500}
.top .sp{flex:1}
.gsearch{display:flex;align-items:center;gap:6px;background:var(--top2);border:1px solid #2c4263;height:26px;padding:0 8px;width:280px;color:#8fa3bd}
.gsearch input{background:none;border:0;outline:0;color:#fff;font:inherit;width:100%}
.top .meta{color:#8fa3bd;font-size:12px}

.main{display:grid;grid-template-columns:52px 1fr;min-height:0}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.rail a{width:44px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);text-decoration:none;font-size:10px;border-left:2px solid transparent}
.rail a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail a.on{color:var(--ac);border-left-color:var(--ac);background:var(--ac-bg)}
.rail a:hover{color:var(--tx)}

.work{display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}
/* page header */
.ph{background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:flex-end;gap:22px;height:44px}
.ph h1{font-size:15px;font-weight:600;align-self:center;margin-right:6px}
.tabs{display:flex;gap:20px;align-self:stretch}
.tabs button{border-bottom:2px solid transparent;color:var(--tx2);padding:0 1px;display:flex;align-items:center}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}
.ph .sp{flex:1}
.ph .tools{align-self:center;display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:3px 9px;font-size:12px;color:var(--tx2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac-bg);color:var(--ac2);font-weight:500}
.btn{border:1px solid var(--line);padding:3px 10px;font-size:12px;background:#fff;display:flex;gap:5px;align-items:center}
.btn:hover{border-color:#b9c2ce}

/* timeline strip */
.strip{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.kpis{display:flex;gap:0}
.kpi{padding:0 18px 0 0;margin-right:18px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11px;color:var(--tx3);text-transform:none;letter-spacing:.2px}
.kpi .v{font:500 18px var(--mono);color:var(--tx)}
.kpi .v small{font-size:11px;color:var(--tx3);margin-left:3px;font-family:'IBM Plex Sans KR'}
.hist{height:48px;position:relative}
.hist svg{width:100%;height:100%;display:block}
.legend{display:flex;gap:12px;font-size:11px;color:var(--tx3);justify-content:flex-end;margin-bottom:2px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-0px}

/* body: facets + table */
.body{display:grid;grid-template-columns:232px 1fr;min-height:0;position:relative;transition:grid-template-columns .18s ease}
.body.nof{grid-template-columns:46px 1fr}
.body.nof .facets>*:not(.frow),.body.nof .fsearch{display:none}
.sbt.sbt-m{display:none}
.sbt{width:26px;height:24px;display:grid;place-items:center;border:1px solid var(--line);color:var(--tx2);flex:none}
.sbt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.sbt:hover{color:var(--tx);border-color:#b9c2ce}
.sbt.on{background:var(--ac-bg);color:var(--ac2);border-color:#c6d6ea}
.sbt.on svg .fill{fill:currentColor;stroke:none}
.facets{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 0 30px}
.frow{display:flex;gap:6px;align-items:center;margin:0 10px 8px}
.fsearch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);height:26px;padding:0 8px;color:var(--tx3);background:#fff}
.fsearch:focus-within{border-color:#9db6d4}
.fsearch input{border:0;outline:0;font:inherit;width:100%;color:var(--tx);background:#fff;-webkit-appearance:none;appearance:none}
.fsearch input::placeholder{color:var(--tx3)}
.fhead{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:11px;color:var(--tx3);background:#f6f8fa;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-top:6px;letter-spacing:.3px}
.fhead button{font-size:11px;color:var(--ac)}
.fg{padding:6px 12px 2px}
.fg h4{font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;cursor:pointer;user-select:none}
.fg h4 .car{width:14px;text-align:center;color:var(--tx3);font:400 14px/1 var(--mono)}
.fg h4:hover .car{color:var(--tx)}
.fg.closed ul{display:none}
.fg ul{list-style:none}
.fg li{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;color:var(--tx2)}
.fg li:hover{color:var(--tx)}
.fg li .cb{width:12px;height:12px;border:1px solid #aab4c1;display:grid;place-items:center;flex:none;background:#fff}
.fg li.on .cb{background:var(--ac);border-color:var(--ac)}
.fg li.on .cb:after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(0,-1px)}
.fg li .sw{width:3px;height:12px;flex:none}
.fg li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg li .ct{font:11px var(--mono);color:var(--tx3)}
.fg li.zero{opacity:.45}
.fg .more{font-size:11px;color:var(--ac);padding:2px 0 0 19px}

.tablewrap{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;background:var(--panel)}
.tbar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.tbar b{color:var(--tx);font-weight:600}
.tsearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);height:26px;padding:0 8px;width:280px;background:#fff;color:var(--tx3)}
.tsearch:focus-within{border-color:#9db6d4}
.tsearch input{border:0;outline:0;font:inherit;width:100%;color:var(--tx);background:#fff;appearance:none}
.tsearch input::placeholder{color:var(--tx3)}
.psel{position:relative}
.psel>button{height:26px;border:1px solid var(--line);background:#fff;padding:0 8px 0 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx);white-space:nowrap}
.psel>button:hover,.psel.open>button{border-color:#9db6d4}
.psel>button svg{width:10px;height:10px;stroke:var(--tx2);fill:none;stroke-width:2;transition:transform .15s}
.psel.open>button svg{transform:rotate(180deg)}
.psel ul{display:none;position:absolute;right:0;top:calc(100% + 3px);min-width:100%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(20,36,59,.1);list-style:none;z-index:20;padding:3px 0}
.psel.open ul{display:block}
.psel li{padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.psel li:hover{background:#f3f6fa}
.psel li.on{color:var(--ac);font-weight:600;background:var(--ac-bg)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid #c6d6ea;background:var(--ac-bg);color:var(--ac2);padding:0 6px;font-size:11px;display:flex;gap:4px;align-items:center}
.chip button{color:var(--ac2);font-size:12px;line-height:1}
.tbar .sp{flex:1}
.scroll{overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
thead th{position:sticky;background:#f6f8fa;z-index:2;font-weight:500;color:var(--tx2);font-size:11px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
thead tr.g th{top:0;height:22px;padding:0 10px;text-align:center;letter-spacing:.8px;color:var(--tx3);border-bottom:1px solid var(--line2);font-size:10px}
thead tr.g th+th{border-left:1px solid var(--line)}
thead tr.c th{top:22px;height:28px;padding:0 10px;cursor:pointer;user-select:none}
thead tr.c th.r{text-align:right}
thead tr.c th.gl{border-left:1px solid var(--line)}
thead th .ar{color:var(--ac);margin-left:3px}
tbody td{padding:0 10px;height:32px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody td.r{text-align:right}
tbody td.gl{border-left:1px solid var(--line2)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f5f8fc}
tbody tr.sel td{background:var(--ac-bg)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--ac)}
td.bar{padding:0 0 0 0;width:4px}
td.bar i{display:block;width:3px;height:20px}
td.dt{color:var(--tx2);font-size:12px}
td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
td.nm .sub{display:block;font-weight:400;font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;margin-top:-2px}
td.nm.two{height:40px;line-height:1.3}
td.party{max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:12px}
td.mut{color:var(--tx3)}
.badge{display:inline-block;font-size:11px;padding:0 6px;line-height:18px;border:1px solid;font-weight:500}
.dash{color:#c0c7d1}
.tfoot{border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:6px 14px;font-size:12px;color:var(--tx2)}
.tfoot .sp{flex:1}
.pg{display:flex;gap:2px}
.pg button{min-width:24px;height:22px;border:1px solid transparent;font:12px var(--mono);color:var(--tx2)}
.pg button.on{border-color:var(--line);background:#fff;color:var(--tx);font-weight:500}
.pg button:disabled{opacity:.35;cursor:default}
.pg .gap{min-width:18px;text-align:center;color:var(--tx3);font:12px var(--mono);line-height:22px}
.note{font-size:11px;color:var(--tx3)}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(640px,62%);background:var(--panel);border-left:1px solid #c3cbd6;box-shadow:-8px 0 24px rgba(20,36,59,.08);transform:translateX(102%);opacity:0;transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .26s cubic-bezier(.4,0,.2,1);display:grid;grid-template-rows:auto auto 1fr;z-index:10}
.drawer.open{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dh{padding:12px 16px 10px;border-bottom:1px solid var(--line2);border-top:3px solid var(--ac)}
.dh .r1{display:flex;align-items:flex-start;gap:10px}
.dh h2{font-size:16px;font-weight:600;flex:1;line-height:1.35}
.dh .x{font-size:18px;color:var(--tx3);line-height:1;padding:2px 4px}
.dh .x:hover{color:var(--tx)}
.dh .r2{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.dh .r2 .pill{border:1px solid var(--line);padding:0 6px;line-height:18px;font-size:11px;color:var(--tx2)}
.dh .r2 a{color:var(--ac);text-decoration:none;margin-left:auto}
.dh .r2 a:hover{text-decoration:underline}
.dtabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);height:34px}
.dtabs button{border-bottom:2px solid transparent;color:var(--tx2);font-size:12px}
.dtabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}
.dbody{overflow:auto;padding:14px 16px 30px}
.terms{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:16px}
.terms>div{padding:8px 10px;border-right:1px solid var(--line2)}
.terms>div:last-child{border-right:0}
.terms .l{font-size:10px;letter-spacing:.6px;color:var(--tx3)}
.terms .v{font:500 16px var(--mono);margin-top:1px}
.terms .v.na{color:#b4bcc7;font-size:13px;font-family:'IBM Plex Sans KR'}
.terms .s{font-size:10px;color:var(--tx3)}
.sec{margin-bottom:16px}
.sec h5{font-size:11px;letter-spacing:.6px;color:var(--tx3);font-weight:500;padding-bottom:4px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--tx3)}
.kv dd{color:var(--tx)}
.lst{list-style:none;font-size:12px}
.lst li{padding:3px 0 3px 12px;position:relative;color:var(--tx)}
.lst li:before{content:"";position:absolute;left:2px;top:10px;width:4px;height:1px;background:var(--tx3)}
.quote{font-size:12px;background:#f6f8fa;border-left:2px solid #b9c6d6;padding:8px 10px;color:var(--tx2)}
.quote .auto{font-size:10px;color:var(--tx3);display:block;margin-top:4px}
.tt{width:100%;border-collapse:collapse;font-size:12px;min-width:0}
.tt th{font-weight:500;color:var(--tx3);font-size:11px;text-align:left;border-bottom:1px solid var(--line);padding:4px 6px;background:#f6f8fa;position:static}
.tt td{border-bottom:1px solid var(--line2);padding:5px 6px;height:auto;white-space:normal}
.tt .r{text-align:right}
.calc{font-size:11px;color:var(--tx2);margin-top:8px;line-height:1.6}
.calc b{color:var(--tx3);font-weight:500;display:inline-block;width:42px}
.empty{color:var(--tx3);font-size:12px;padding:16px 0}
.rel li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.rel li:hover .n{color:var(--ac)}
.rel .d{color:var(--tx3);width:44px;flex:none}
.rel .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .a{font-family:var(--mono);color:var(--tx2)}
.fbtn{display:none}

@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .rail,.gsearch,.top .meta,.top .crumb,.top .sep,.hist,.legend{display:none}
  .strip{grid-template-columns:1fr}
  .body{grid-template-columns:1fr}
  .facets{position:absolute;inset:0 30% 0 0;z-index:9;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.1)}
  .facets.open{transform:none}
  .fbtn{display:flex}
  .sbt.sbt-m{display:grid}
  .drawer{width:100%}
  .ph{gap:12px;overflow-x:auto}
  .ph .tools .seg{display:none}
  .ph h1,.btn{white-space:nowrap}
  .tsearch{width:auto;flex:1;min-width:0}
  .tbar .sp{display:none}
  .ph .tabs,.tbar .note,.tfoot .note{display:none}
  .kpis{flex-wrap:wrap;row-gap:6px}
  .kpi{margin-right:12px;padding-right:12px}
  .kpi .v{font-size:15px}
  .terms{grid-template-columns:repeat(2,1fr)}
  .terms>div:nth-child(2){border-right:0}
  .terms>div:nth-child(-n+2){border-bottom:1px solid var(--line2)}
}
</style>
<style>body{min-width:1200px}a.btn{text-decoration:none;color:inherit}.rail a.dis{opacity:.45;cursor:default}.rail a{position:relative}.wsbadge{display:none}</style>
<meta name="ag-base" content="">
<style>
body.ag-locked>:not(#ag-gate):not(script){display:none!important}
#ag-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f3f5f8;font-family:'IBM Plex Sans KR','Pretendard','Apple SD Gothic Neo',sans-serif;color:#1d2733}
#ag-gate .box{width:380px;background:#fff;border:1px solid #dfe3e9;border-top:3px solid #14243b;padding:34px 34px 26px;box-shadow:0 18px 50px rgba(20,36,59,.08)}
#ag-gate .br{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:.2px}
#ag-gate .br small{font-weight:400;color:#5b6675;font-size:13px}
#ag-gate h1{font-size:19px;font-weight:600;margin:26px 0 6px;color:#1d2733;letter-spacing:0}
#ag-gate p{font-size:13px;line-height:1.65;color:#5b6675;margin:0}
#ag-gate .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;margin-top:22px;border:1px solid #c9d0d9;background:#fff;font:500 14px inherit;font-family:inherit;color:#1d2733;cursor:pointer}
#ag-gate .gbtn:hover{border-color:#14243b;background:#f8fafc}
#ag-gate form{margin-top:18px}#ag-gate label{display:block;font-size:12px;color:#5b6675;margin-top:10px}
#ag-gate input{display:block;width:100%;box-sizing:border-box;height:40px;margin-top:4px;border:1px solid #c9d0d9;padding:0 11px;font:inherit;font-size:14px;color:#1d2733;background:#fff;color-scheme:light;-webkit-appearance:none;appearance:none;border-radius:0;outline:0}
#ag-gate input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:#1d2733}
#ag-gate input:focus{border-color:#14243b}
#ag-gate .pbtn{width:100%;height:42px;margin-top:16px;background:#14243b;color:#fff;border:0;font:inherit;font-size:14px;font-weight:500;cursor:pointer}#ag-gate .pbtn:disabled{opacity:.6}
#ag-gate .err{color:#b3364a;font-size:12.5px;margin-top:10px;min-height:0}
#ag-gate .sw{font-size:12.5px;color:#5b6675;margin-top:14px}#ag-gate .sw button{background:none;border:0;color:#2463a8;font:inherit;cursor:pointer;padding:0}
#ag-gate .lnk{background:none;border:0;color:#2463a8;font:inherit;font-size:12.5px;cursor:pointer;padding:0;margin-top:16px}
#ag-gate .ft{margin-top:24px;padding-top:14px;border-top:1px solid #eef1f4;font-size:11.5px;color:#8b95a3;line-height:1.6}
#ag-gate .who{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;background:#f6f8fa;font-size:13px}
#ag-gate .who img,#ag-gate .who i{width:28px;height:28px;border-radius:50%;background:#dfe7f2;display:grid;place-items:center;font-style:normal;font-weight:600;color:#14243b}
#ag-gate .badge{display:inline-block;font-size:11px;padding:2px 8px;margin-top:20px;font-weight:600}
#ag-gate .badge.p{background:#fbf3e3;color:#8a5a00}#ag-gate .badge.r{background:#fcedef;color:#b3364a}#ag-gate .badge.e{background:#eef1f5;color:#5b6675}
#ag-gate .spin{width:22px;height:22px;border:2px solid #dfe3e9;border-top-color:#14243b;border-radius:50%;animation:agspin .8s linear infinite;margin:20px auto 0}
@keyframes agspin{to{transform:rotate(360deg)}}

(function(){

const BRAND=`<div class="br"><svg viewBox="0 0 20 20" width="30" height="30" aria-hidden="true"><g fill="none" stroke="#8fa3bd" stroke-width="1.2"><circle cx="4" cy="4" r="2"/><circle cx="10" cy="4" r="2"/><circle cx="16" cy="4" r="2"/><circle cx="4" cy="10" r="2"/><circle cx="16" cy="10" r="2"/><circle cx="4" cy="16" r="2"/><circle cx="10" cy="16" r="2"/><circle cx="16" cy="16" r="2"/></g><circle cx="10" cy="10" r="2.6" fill="#6ea6dd"/></svg><span>Argus <small>Research</small></span></div>`;
const FT='<div class="ft">승인된 회원만 이용할 수 있는 비공개 리서치 사이트입니다. 서비스 운영과 보안을 위해 접속·열람·다운로드 기록이 저장되며 관리자가 확인할 수 있습니다.</div>';
const av=p=>p&&p.avatar?`<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer">`:`<i>${esc(((p&&(p.name||p.email))||'?').slice(0,1))}</i>`;
let sb=null;
function view(state,p,msg){
  if(!G)return;
  const who=p?`<div class="who">${av(p)}<div><div>${esc(p.name||'')}</div><div style="color:#8b95a3;font-size:12px">${esc(p.email||'')}</div></div></div>`:'';
  const out='<button class="lnk" id="ag-out">다른 계정으로 로그인</button>';
  G.innerHTML=`<div class="box">${BRAND}${
    state==='loading'?'<div class="spin" aria-label="확인 중"></div>':
    state==='login'?`<h1>로그인</h1><form id="ag-f"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="pw" type="password" autocomplete="current-password" required minlength="8"></label><div class="err" id="ag-err"></div><button class="pbtn">로그인</button></form><div class="sw">처음이신가요? <button id="ag-to-up">회원가입</button> · <button id="ag-forgot">비밀번호를 잊으셨나요?</button></div>`:
    state==='signup'?`<h1>회원가입</h1><p>가입 후 관리자가 승인하면 이용할 수 있습니다.</p><form id="ag-f"><label>이름<input name="name" required maxlength="40" autocomplete="name"></label><label>소속 (회사·팀)<input name="org" maxlength="60" autocomplete="organization"></label><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호 (8자 이상)<input name="pw" type="password" autocomplete="new-password" required minlength="8"></label><div class="err" id="ag-err"></div><button class="pbtn">가입 신청</button></form><div class="sw">이미 계정이 있나요? <button id="ag-to-in">로그인</button></div>`:
    state==='forgot'?`<h1>비밀번호 재설정</h1><p>비밀번호를 잊으셨다면 관리자에게 연락해 주세요. 관리자가 임시 비밀번호를 정해 드리면, 로그인한 뒤 화면 오른쪽 위 「비밀번호 변경」에서 새 비밀번호로 바꿀 수 있습니다.</p><div class="sw"><button id="ag-to-in">로그인으로 돌아가기</button></div>`:
    state==='pending'?`<span class="badge p">승인 대기</span><h1>가입 신청이 접수되었습니다</h1><p>관리자가 승인하면 바로 이용할 수 있습니다. 승인 후 이 페이지를 새로고침하세요.</p>${who}${out}`:
    state==='rejected'?`<span class="badge r">이용 불가</span><h1>이용 승인이 되지 않은 계정입니다</h1><p>다른 계정으로 로그인하거나 관리자에게 문의해 주세요.</p>${who}${out}`:

  }${FT}</div>`;
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on('ag-to-up',()=>view('signup'));on('ag-to-in',()=>view('login'));on('ag-forgot',()=>view('forgot'));
  const f=document.getElementById('ag-f');
  if(f)f.onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(f));const btn=f.querySelector('button');const er=document.getElementById('ag-err');er.textContent='';btn.disabled=true;
    const KO={'Invalid login credentials':'이메일 또는 비밀번호가 맞지 않습니다.','User already registered':'이미 가입된 이메일입니다. 로그인해 주세요.','Email not confirmed':'이메일 확인이 필요한 설정으로 되어 있습니다. 관리자에게 알려 주세요.','Email address not authorized':'가입 메일을 보낼 수 없는 설정입니다. 관리자에게 알려 주세요.'};
    const msg=e=>KO[e.message]||(/rate limit/i.test(e.message)?'잠시 후 다시 시도해 주세요.':/Password should be/i.test(e.message)?'비밀번호는 8자 이상으로 정해 주세요.':e.message);

      }else{
        const {error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.pw});if(error)throw error;
      }
      boot();
    }catch(e){er.textContent=msg(e);btn.disabled=false}};
  const first=G.querySelector('input');if(first)first.focus();
  const o=document.getElementById('ag-out');if(o)o.onclick=async()=>{await sb.auth.signOut();view('login')};
  const r=document.getElementById('ag-re');if(r)r.onclick=()=>location.reload();

function chip(p){
  const host=document.querySelector('[data-ag-user]')||document.querySelector('.topnav .navr')||document.querySelector('.topnav .wrap')||document.querySelector('header');
  if(!host||document.querySelector('.ag-user'))return;
  const base=document.querySelector('meta[name=ag-base]');const b=base?base.content:'';
  host.insertAdjacentHTML('beforeend',`<div class="ag-user">${av(p)}<span>${esc(p.name||p.email)}</span>${p.role==='admin'?`<a href="${b}admin.html">회원 관리</a>`:''}<button id="ag-pw">비밀번호 변경</button><button id="ag-logout">로그아웃</button></div>`);

    const {error}=await sb.auth.updateUser({password:a});alert(error?'변경하지 못했습니다: '+error.message:'비밀번호를 바꿨습니다.')};
  document.getElementById('ag-logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
let ready=null;const waiters=[];
window.ArgusAuth={ready(cb){ready?cb(ready):waiters.push(cb)},client:()=>sb,
  async file(name){const {data,error}=await sb.storage.from('private').createSignedUrl(name,120,{download:name});if(error)throw error;window.ArgusAuth.log&&window.ArgusAuth.log('download',name);return data.signedUrl}};
async function boot(){
  view('loading');ready=null;
  if(!window.supabase){view('error',null,'로그인 모듈을 불러오지 못했습니다. 네트워크를 확인해 주세요.');return}
  sb=sb||window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){view('login');return}
  const {data:p,error}=await sb.rpc('touch_me');
  if(error||!p){view('error',null,error?error.message:'회원 정보를 찾지 못했습니다.');return}
  if(p.status!=='approved'){view(p.status==='rejected'?'rejected':'pending',p);return}
  if(/[?&](code|error)=/.test(location.search))history.replaceState(null,'',location.pathname);
  ready={sb,profile:p};
  const log=(a,t,m)=>sb.rpc('log_event',{p_action:a,p_target:t||null,p_meta:m||null}).then(()=>{},()=>{});
  window.ArgusAuth.log=log;
  try{if(!sessionStorage.getItem('ag-login')){sessionStorage.setItem('ag-login','1');log('login',location.pathname)}}catch(_){}
  log('view',location.pathname+location.hash);
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="http"]');if(a&&a.host!==location.host)log('open',a.href,{text:(a.textContent||'').trim().slice(0,120)})},true);
  try{for(const w of waiters)await w(ready)}catch(e){view('error',null,e.message);return}
  G&&G.remove();document.body.classList.remove('ag-locked');chip(p);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

];

function inRange(x){if(S.sel.q&&S.sel.q.size)return true;if(!S.days)return true;return (TODAY-new Date(x.date))/864e5 < S.days}
function matchQ(x){if(!S.q)return true;const h=(x.name+' '+x.p.join(' ')+' '+(x.lender||'')+' '+x.asset+' '+x.region).toLowerCase();return h.includes(S.q)}
function pass(x,skip){
  if(!inRange(x)||!matchQ(x))return false;
  for(const f of FACETS){if(f.k===skip)continue;const s=S.sel[f.k];if(s.size&&!s.has(x[f.k]||''))return false}
  return true;
}
function filtered(){return D.filter(x=>pass(x))}

function renderFacets(){
  const box=document.getElementById('fgs');box.innerHTML='';
  for(const f of FACETS){
    const all=new Map(),cur=new Map();
    D.forEach(x=>{if(!f.allTime&&!inRange(x))return;const v=x[f.k]||'';all.set(v,0)});
    D.forEach(x=>{if(pass(x,f.k)){const v=x[f.k]||'';cur.set(v,(cur.get(v)||0)+1)}});
    let vals=[...all.keys()];
    if(f.desc)vals.sort((a,b)=>b.localeCompare(a));
    else if(f.order)vals.sort((a,b)=>f.order.indexOf(a)-f.order.indexOf(b));
    else vals.sort((a,b)=>(cur.get(b)||0)-(cur.get(a)||0)||a.localeCompare(b,'ko'));
    if(S.fq)vals=vals.filter(v=>(v||f.blank||'').toLowerCase().includes(S.fq));
    const lim=f.limit&&!f.more&&!S.fq?f.limit:999, extra=vals.length-lim;
    const g=document.createElement('div');g.className='fg'+(f.closed?' closed':'');
    g.innerHTML=`<h4>${f.t}<span class="car">${f.closed?'+':'−'}</span></h4><ul>${vals.slice(0,lim).map(v=>{const n=cur.get(v)||0,on=S.sel[f.k].has(v);
      return `<li data-k="${f.k}" data-v="${esc(v)}" class="${on?'on':''} ${n?'':'zero'}"><span class="cb"></span>${f.color?`<span class="sw" style="background:${f.color(v)}"></span>`:''}<span class="nm">${esc(v||f.blank||'-')}</span><span class="ct">${n}</span></li>`}).join('')}</ul>${extra>0?`<ul><li class="more" data-more="${f.k}">+ ${extra}개 더보기</li></ul>`:''}`;
    g.querySelector('h4').onclick=()=>{f.closed=!f.closed;renderFacets()};
    box.appendChild(g);
  }
  box.querySelectorAll('li[data-k]').forEach(li=>li.onclick=()=>{const s=S.sel[li.dataset.k],v=li.dataset.v;s.has(v)?s.delete(v):s.add(v);S.page=1;render()});
  box.querySelectorAll('[data-more]').forEach(li=>li.onclick=()=>{FACETS.find(f=>f.k===li.dataset.more).more=true;renderFacets()});
}

const qtr=d=>d.slice(2,4)+'.'+(Math.floor((+d.slice(5,7)-1)/3)+1)+'Q';
function sortVal(x,k){if(k==='q')return x.date;if(k==='party')return x.p.join(' ');if(k==='name')return x.name;const v=x[k];return v==null||v===''||v===0&&k==='eok'?null:v}
function renderTable(rows){
  const {k,d}=S.sort;
  rows.sort((a,b)=>{const A=sortVal(a,k),B=sortVal(b,k);if(A==null&&B==null)return (b.added||'').localeCompare(a.added||'');if(A==null)return 1;if(B==null)return -1;
    return (A>B?1:A<B?-1:0)*d || (b.added||'').localeCompare(a.added||'')});
  document.getElementById('hdr').innerHTML=COLS.map(c=>`<th data-k="${c.k}" class="${c.r?'r':''} ${c.gl?'gl':''}" ${c.k==='_bar'?'style="width:4px;padding:0;cursor:default"':''}>${c.t}${S.sort.k===c.k?`<span class="ar">${S.sort.d>0?'↑':'↓'}</span>`:''}</th>`).join('');
  document.querySelectorAll('#hdr th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k==='_bar')return;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:['name','asset','region','src','kind','party','lender'].includes(k)?1:-1};render()});
  const pages=Math.max(1,Math.ceil(rows.length/S.per));if(S.page>pages)S.page=pages;
  const view=rows.slice((S.page-1)*S.per,S.page*S.per);
  const dash='<span class="dash">—</span>';
  document.getElementById('tb').innerHTML=view.map(x=>{
    const idx=D.indexOf(x);const pa=x.p.join(' · ');
    const amt=x.eok?`<span class="num">${fmtEok(x.eok)}</span>`:`<span class="mut">${esc(x.amt||'미공개')}</span>`;
    const lender=x.lender?esc(x.lender):dash;
    return `<tr data-i="${idx}" class="${S.open===idx?'sel':''}">
      <td class="bar"><i style="background:${x.grp==='조달'?'#2463a8':'#9fb6d1'}"></i></td>
      <td class="dt num">${x.date.slice(5)}</td>
      <td class="dt num">${qtr(x.date)}</td>
      <td class="nm ${x.size?'two':''}" title="${esc(x.name)}">${esc(x.name)}${x.size?`<span class="sub">${esc(x.size)}</span>`:''}</td>
      <td>${esc(x.asset)}</td>
      <td class="${x.region?'':'mut'}">${esc(x.region)||dash}</td>
      <td class="gl">${badge(x.kind)}</td>
      <td class="party" title="${esc(pa)}">${pa?esc(pa):dash}</td>
      <td class="party" title="${esc(x.lender||'')}">${lender}</td>
      <td class="r gl">${amt}</td>
      <td class="r num">${pct(x.ltv)}</td>
      <td class="r num">${pct(x.allin)}</td>
      <td class="r num">${pct(x.cap)}</td></tr>`}).join('')||`<tr><td colspan="13" class="empty" style="text-align:center">조건에 맞는 딜이 없습니다</td></tr>`;
  document.querySelectorAll('#tb tr[data-i]').forEach(tr=>tr.onclick=()=>openDrawer(+tr.dataset.i));
  // pager
  const pg=document.getElementById('pg');let h=`<button ${S.page<=1?'disabled':''} data-p="${S.page-1}">‹</button>`;
  let gap=false;for(let i=1;i<=pages;i++){if(pages>7&&Math.abs(i-S.page)>1&&i!==1&&i!==pages){if(!gap){h+='<span class="gap">…</span>';gap=true}continue}gap=false;h+=`<button data-p="${i}" class="${i===S.page?'on':''}">${i}</button>`}
  h+=`<button ${S.page>=pages?'disabled':''} data-p="${S.page+1}">›</button>`;pg.innerHTML=h;
  pg.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{S.page=+b.dataset.p;render()});
}

function renderStrip(rows){
  const n=rows.length,sum=rows.reduce((a,x)=>a+(x.eok||0),0),fin=rows.filter(x=>x.grp==='조달').length,rate=rows.filter(x=>x.allin!=null).length;
  document.getElementById('k1').innerHTML=`${n}<small>건</small>`;
  document.getElementById('k2').textContent=fmtEok(sum);
  document.getElementById('k3').innerHTML=`${fin}<small>/</small>${n-fin}`;
  document.getElementById('k4').innerHTML=`${rate}<small>건</small>`;
  document.getElementById('cnt').textContent=n;
  document.getElementById('cnt2').textContent=`/ 기간 내 ${D.filter(inRange).length}건`;
  // histogram
  const days=(S.days&&!S.sel.q.size)?S.days:Math.ceil((TODAY-new Date(D.reduce((m,x)=>x.date<m?x.date:m,'9')))/864e5)+1;
  const by=[];for(let i=days-1;i>=0;i--){const t=new Date(TODAY-i*864e5);by.push({d:t.toISOString().slice(0,10),a:0,b:0})}
  const map=Object.fromEntries(by.map(o=>[o.d,o]));rows.forEach(x=>{const o=map[x.date];if(o)x.grp==='조달'?o.a++:o.b++});
  const mx=Math.max(1,...by.map(o=>o.a+o.b)),W=by.length*10,H=48,bw=10;
  let s='';by.forEach((o,i)=>{const ha=o.a/mx*(H-4),hb=o.b/mx*(H-4);const x=i*bw+1.5,w=bw-3;
    s+=`<rect x="${x}" y="${H-ha}" width="${w}" height="${ha}" fill="#2463a8"><title>${o.d} 조달 ${o.a}</title></rect><rect x="${x}" y="${H-ha-hb}" width="${w}" height="${hb}" fill="#9fb6d1"><title>${o.d} 매매 ${o.b}</title></rect>`});
  s+=`<line x1="0" x2="${W}" y1="${H-.5}" y2="${H-.5}" stroke="#dbe0e7"/>`;
  const svg=document.getElementById('hist');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s;
}

function renderChips(){
  const c=[];FACETS.forEach(f=>S.sel[f.k].forEach(v=>c.push(`<span class="chip">${f.t}: ${esc(v||f.blank)}<button data-k="${f.k}" data-v="${esc(v)}">×</button></span>`)));
  const box=document.getElementById('chips');box.innerHTML=c.join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.sel[b.dataset.k].delete(b.dataset.v);render()});
}

function render(){const qs=S.sel.q.size;document.querySelectorAll('#range button').forEach(b=>b.classList.toggle('on',!qs&&+b.dataset.d===S.days));const rows=filtered();renderFacets();renderStrip(rows);renderChips();renderTable(rows)}

/* drawer */
function openDrawer(i){S.open=i;S.tab='ov';drawDrawer();document.getElementById('dr').classList.add('open');document.querySelectorAll('#tb tr').forEach(tr=>tr.classList.toggle('sel',+tr.dataset.i===i))}
function closeDrawer(){S.open=null;document.getElementById('dr').classList.remove('open');document.querySelectorAll('#tb tr.sel').forEach(tr=>tr.classList.remove('sel'))}
function drawDrawer(){
  const x=D[S.open];if(!x)return;
  document.getElementById('dh').innerHTML=`<div class="r1"><h2>${esc(x.name)}</h2><button class="x" id="dx" aria-label="닫기">×</button></div>
   <div class="r2">${badge(x.kind)}<span class="pill">${esc(x.cat)} · ${esc(x.grp)}</span><span class="pill">${esc(x.asset)}${x.region?' · '+esc(x.region):''}</span><span class="num">${x.date}</span><a href="${esc(x.url)}" target="_blank" rel="noopener">원문 기사 · ${esc(x.src)} ↗</a></div>`;
  document.getElementById('dx').onclick=closeDrawer;
  document.querySelectorAll('#dtabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===S.tab);b.onclick=()=>{S.tab=b.dataset.t;drawDrawer()}});
  const db=document.getElementById('db');
  const t=(l,v,s)=>`<div><div class="l">${l}</div><div class="v ${v==null?'na':''}">${v==null?'미공개':v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  if(S.tab==='ov'){
    db.innerHTML=`<div class="terms">${t('금액',x.eok?fmtEok(x.eok):null,x.metric||'')}${t('LTV',x.ltv!=null?x.ltv.toFixed(1)+'%':null,x.ltv_calc?'공시 기반 계산':'')}${t('금리 (All-in)',x.allin!=null?x.allin.toFixed(2)+'%':null,x.coupon!=null?'표면 '+x.coupon.toFixed(2)+'%':'')}${t('CAP RATE',x.cap!=null?x.cap.toFixed(2)+'%':null,x.cap_calc?'공시 기반 계산':'')}</div>
    ${x.sz.length?`<div class="sec"><h5>규모</h5><dl class="kv">${x.sz.map(([a,b])=>`<dt>${esc(a)}</dt><dd class="num">${esc(b)}</dd>`).join('')}</dl></div>`:''}
    <div class="sec"><h5>참여자</h5>${x.p.length||x.lender?`<dl class="kv">${x.p.map(s=>{const m=s.match(/^(\S+)\s(.+)$/);return m?`<dt>${esc(m[1])}</dt><dd>${esc(m[2])}</dd>`:`<dt></dt><dd>${esc(s)}</dd>`}).join('')}${x.lender&&!x.p.some(s=>s.startsWith('대주'))?`<dt>대주</dt><dd>${esc(x.lender)}</dd>`:''}</dl>`:'<div class="empty">기사에 명시된 참여자 없음</div>'}</div>
    ${x.detail.length?`<div class="sec"><h5>세부 사항</h5><ul class="lst">${x.detail.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
    <div class="sec"><h5>투자자 및 자금조달 관련 사항</h5><div class="quote">${esc(x.fin?.text||'-')}${x.fin?.auto?'<span class="auto">자동 생성 문구 (기사 수치 기반)</span>':''}</div></div>
    <div class="sec"><h5>출처</h5><dl class="kv"><dt>매체</dt><dd>${esc(x.src)} (${esc(x.dom)})</dd><dt>수집 시각</dt><dd class="num">${esc((x.added||'').replace('T',' ').slice(0,16))}</dd></dl></div>`;
  }else if(S.tab==='st'){
    const tr=x.tr||[];
    db.innerHTML=`<div class="sec"><h5>트랜치 ${tr.length?`(${tr.length})`:''}</h5>${tr.length?`<table class="tt"><thead><tr><th>트랜치</th><th>대주</th><th class="r">금액</th><th class="r">금리</th></tr></thead><tbody>${tr.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.l||'-')}</td><td class="r num">${esc(r.a||'—')}</td><td class="r num">${r.r!=null?r.r.toFixed(2)+'%':'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">기사에 공개된 트랜치 정보가 없습니다.</div>'}
    ${x.rdebt?`<div class="calc"><div><b>근거</b>${esc(x.rdebt.src)}</div>${x.rdebt.ltvb?`<div><b>LTV</b>${esc(x.rdebt.ltvb)}</div>`:''}${x.rdebt.capb?`<div><b>Cap</b>${esc(x.rdebt.capb)}</div>`:''}${x.rdebt.mat?`<div><b>만기</b>${esc(x.rdebt.mat)}</div>`:''}</div>`:''}</div>`;
  }else{
    const rel=D.filter((y,j)=>j!==S.open&&y.asset===x.asset).slice(0,12);
    const same=D.filter((y,j)=>j!==S.open&&x.region&&y.region===x.region).slice(0,8);
    const li=a=>a.map(y=>`<li data-i="${D.indexOf(y)}"><span class="d num">${y.date.slice(5)}</span><span class="n">${esc(y.name)}</span>${badge(y.kind)}<span class="a">${y.eok?fmtEok(y.eok):'—'}</span></li>`).join('');
    db.innerHTML=`<div class="sec"><h5>같은 자산유형 · ${esc(x.asset)}</h5><ul class="lst rel" style="padding:0">${li(rel)||'<div class="empty">없음</div>'}</ul></div>
      ${x.region?`<div class="sec"><h5>같은 권역 · ${esc(x.region)}</h5><ul class="lst rel" style="padding:0">${li(same)||'<div class="empty">없음</div>'}</ul></div>`:''}`;
    db.querySelectorAll('li[data-i]').forEach(l=>{l.style.paddingLeft='0';l.onclick=()=>openDrawer(+l.dataset.i)});
  }
  db.scrollTop=0;
}

/* wiring */
document.getElementById('q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();S.page=1;render()};
document.getElementById('fq').oninput=e=>{S.fq=e.target.value.trim().toLowerCase();renderFacets()};
document.getElementById('reset').onclick=()=>{FACETS.forEach(f=>S.sel[f.k].clear());S.page=1;render()};
document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{S.sel.q.clear();S.days=+b.dataset.d;S.page=1;render()});
const mq=matchMedia('(max-width:820px)'),sbts=[...document.querySelectorAll('.sbt')],bodyEl=document.querySelector('.body'),fac=document.getElementById('facets');
function setPanel(open){if(mq.matches){fac.classList.toggle('open',open)}else{bodyEl.classList.toggle('nof',!open);try{localStorage.setItem('dp_facets',open?'1':'0')}catch(e){}}sbts.forEach(b=>{b.classList.toggle('on',open);b.setAttribute('aria-expanded',open)})}
function panelOpen(){return mq.matches?fac.classList.contains('open'):!bodyEl.classList.contains('nof')}
sbts.forEach(b=>b.onclick=e=>{e.stopPropagation();setPanel(!panelOpen())});
document.querySelector('.tablewrap').addEventListener('click',e=>{if(mq.matches&&fac.classList.contains('open')){setPanel(false);e.stopPropagation();e.preventDefault()}},true);
(function(){let v='1';try{v=localStorage.getItem('dp_facets')??'1'}catch(e){}if(mq.matches)setPanel(false);else setPanel(v==='1')})();
mq.addEventListener('change',()=>{fac.classList.remove('open');bodyEl.classList.remove('nof');setPanel(!mq.matches)});
const psel=document.getElementById('psel');
try{const v=+localStorage.getItem('dp_per');if([5,10,15,20,30,40,50].includes(v))S.per=v}catch(e){}
function drawPsel(){document.getElementById('pslab').textContent=S.per+'개씩';psel.querySelector('ul').innerHTML=[5,10,15,20,30,40,50].map(n=>`<li role="option" data-n="${n}" class="${n===S.per?'on':''}">${n}개씩</li>`).join('');
  psel.querySelectorAll('li').forEach(li=>li.onclick=()=>{S.per=+li.dataset.n;S.page=1;try{localStorage.setItem('dp_per',S.per)}catch(e){}psel.classList.remove('open');drawPsel();render()})}
drawPsel();
psel.querySelector('button').onclick=e=>{e.stopPropagation();psel.classList.toggle('open')};
document.addEventListener('click',e=>{if(!psel.contains(e.target))psel.classList.remove('open')});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(psel.classList.contains('open'))psel.classList.remove('open');else closeDrawer()}});

(window.ARGUS_DATA?window.ARGUS_DATA('deals'):fetch('deals.json').then(r=>r.json())).then(d=>{
  d.forEach(x=>x.q=qtr(x.date));D=d;const last=d.reduce((m,x)=>x.added>m?x.added:m,'');
  TODAY=new Date(d.reduce((m,x)=>x.date>m?x.date:m,'')+'T23:59:59');
  document.getElementById('updated').textContent='최종 갱신 '+last.replace('T',' ').slice(0,16)+' KST';
  render();
}).catch(()=>{document.getElementById('tb').innerHTML='<tr><td colspan="13" class="empty">데이터를 불러오지 못했습니다</td></tr>'});
</script>
</body>
</html>
